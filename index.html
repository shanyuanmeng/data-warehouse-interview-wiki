    const ITEMS=[
      {c:'warehouse',t:'数据仓库的四个特征',tag:'基础',s:'面向主题、集成、相对稳定（非易失）、反映历史变化（时变）。',q:'数据仓库和业务数据库有什么区别？',key:'用途 → 数据 → 查询',a:'业务数据库（OLTP）服务下单、支付等实时交易，追求高并发、低延迟和事务一致性；数据仓库（OLAP）整合多源历史数据，服务统计分析、趋势判断和决策，查询通常扫描量大、聚合复杂。',trap:'不要只回答“一个存数据、一个做分析”，要从场景、数据和负载三方面对比。'},
      {c:'warehouse',t:'ODS / DWD / DWS / ADS 分层',tag:'高频',s:'原始层 → 明细层 → 汇总层 → 应用层；核心价值是复用、解耦、规范和追溯。',q:'为什么数仓要分层？每层做什么？',key:'复用、解耦、治理',a:'ODS 尽量保留源数据原貌；DWD 完成清洗、标准化和业务过程建模；DWS 按主题沉淀公共汇总；ADS 针对报表或应用输出结果。分层减少重复开发，让口径统一，并缩短故障定位链路。'},
      {c:'warehouse',t:'事实表与维度表',tag:'高频',s:'事实表记录业务事件和度量；维度表描述观察业务的角度。',q:'事实表和维度表如何区分？',key:'事件 + 度量 / 角度 + 属性',a:'事实表的粒度通常是一笔订单、一条点击等业务事件，包含金额、数量等度量及维度外键；维度表包含用户、商品、地区、日期等描述性属性。先声明粒度，再选择维度和事实，是维度建模的基本顺序。'},
      {c:'warehouse',t:'星型、雪花与星座模型',tag:'建模',s:'星型查询简单；雪花减少冗余；星座让多个事实表共享维度。',q:'星型模型和雪花模型怎么选？',key:'查询效率 vs 规范化',a:'星型模型维度反规范化，Join 少、易理解，分析型场景更常见；雪花模型把维度继续拆分，冗余更少但 Join 更多。通常优先星型，除非维度层级复杂且维护冗余成本很高。'},
      {c:'warehouse',t:'缓慢变化维与拉链表',tag:'高频',s:'用生效时间和失效时间保存属性的历史版本，解决“当时是什么”的问题。',q:'拉链表如何保存历史？',key:'业务主键 + 时间区间',a:'每个业务主键可以有多个版本，每条记录带 start_date 与 end_date。属性变化时，关闭旧版本的有效期并插入新版本。查询某天状态时，用日期落在有效区间内进行过滤。'},
      {c:'warehouse',t:'增量与全量同步',tag:'工程',s:'全量简单但成本高；增量依赖更新时间、日志或 CDC，效率更高。',q:'如何设计 MySQL 到数仓的增量同步？',key:'CDC + 幂等 + 补数',a:'可读取 Binlog 做 CDC，按主键和变更类型落到 ODS；下游通过 Merge/Upsert 或分区覆盖保持幂等。同时记录位点、监控延迟，并准备按日期或主键范围重跑的补数方案。'},
      {c:'hdfs',t:'HDFS 核心角色',tag:'基础',s:'NameNode 管元数据，DataNode 存数据块；客户端直接与 DataNode 传输数据。',q:'NameNode 和 DataNode 分别做什么？',key:'元数据 / 数据块',a:'NameNode 维护目录树、权限、文件到 Block 的映射和副本位置；DataNode 保存实际 Block，定期发送心跳与块报告。客户端先向 NameNode 获取位置，再直接读写 DataNode，避免 NameNode 成为数据传输瓶颈。'},
      {c:'hdfs',t:'HDFS 写流程',tag:'高频',s:'申请文件 → 选择节点 → Pipeline 写副本 → 逐级 ACK → 完成。',q:'描述一下 HDFS 写数据流程。',key:'Pipeline + ACK',a:'客户端向 NameNode 申请创建文件；NameNode 校验后为 Block 选择 DataNode；客户端把数据切成 Packet 沿 Pipeline 依次发送，副本写入后 ACK 反向返回；Block 写满后再申请下一组节点，最后通知 NameNode 完成。'},
      {c:'hdfs',t:'HDFS 读流程',tag:'高频',s:'获取块位置后就近读取，失败自动切换副本，并做校验和检查。',q:'描述一下 HDFS 读数据流程。',key:'就近副本 + 容错',a:'客户端向 NameNode 获取各 Block 的副本位置，按网络拓扑选择最近的 DataNode 流式读取；若节点异常或校验失败，就切换其他副本，并把坏块报告给 NameNode。'},
      {c:'hdfs',t:'副本与机架感知',tag:'原理',s:'副本跨节点、跨机架分布，在可靠性和网络开销间平衡。',q:'HDFS 为什么要做机架感知？',key:'容灾 + 带宽',a:'同一机架共享交换机和电源，只跨节点不能防机架故障；副本跨机架可提升容灾能力。但全部跨机架会增加写网络开销，所以 HDFS 会在可靠性、写带宽和读性能之间折中。'},
      {c:'hdfs',t:'小文件问题',tag:'高频',s:'小文件占用大量 NameNode 元数据，并带来大量任务调度与随机寻址开销。',q:'HDFS 小文件有什么危害？怎么解决？',key:'元数据 + 任务开销',a:'每个文件和 Block 都占 NameNode 内存，小文件过多会限制集群规模；计算时还可能产生大量小 Task。可在采集端批量写入，定期合并，使用 SequenceFile/Parquet，或调整上游并行度避免产生过多文件。'},
      {c:'hive',t:'Hive 执行原理',tag:'基础',s:'SQL 经过解析、语义分析与优化，转换成底层执行计划运行。',q:'一条 Hive SQL 经历哪些阶段？',key:'解析 → 优化 → 执行',a:'Driver 接收 SQL，编译器完成词法语法解析和语义分析，优化器做谓词下推、列裁剪、Join 调整等，再生成 MapReduce/Tez/Spark 执行计划并提交，最后返回结果。'},
      {c:'hive',t:'分区与分桶',tag:'高频',s:'分区按目录裁剪数据；分桶按哈希拆文件，利于抽样和部分 Join。',q:'分区和分桶有什么区别？',key:'目录 / 文件',a:'分区字段映射为目录，查询带分区条件时可直接跳过无关目录；分桶对列做哈希，把数据分散到固定数量文件中。分区解决大范围数据裁剪，分桶更适合均匀分布、抽样和 Bucket Join。'},
      {c:'hive',t:'内部表与外部表',tag:'基础',s:'删除内部表通常同时删数据；外部表删除时只删元数据。',q:'什么时候用外部表？',key:'生命周期归属',a:'当底层文件被多个引擎共享、由外部系统管理，或希望删表不影响数据时用外部表；临时中间结果且生命周期完全由 Hive 管理时可用内部表。关键不是语法，而是谁负责数据生命周期。'},
      {c:'hive',t:'Join 策略',tag:'高频',s:'小表广播避免 Shuffle；大表 Join 关注分区、倾斜和输入规模。',q:'Map Join 为什么快？',key:'广播小表，避免 Shuffle',a:'把小表加载到各 Mapper 内存中，大表每条记录在本地完成匹配，不需要按 Join Key 对两张表都 Shuffle。代价是小表必须能放入执行节点内存，否则可能 OOM。'},
      {c:'hive',t:'窗口函数',tag:'SQL',s:'在保留明细行的同时完成分组内排名、累计、前后取值。',q:'row_number、rank、dense_rank 有什么区别？',key:'并列后的序号',a:'row_number 不处理并列，序号永不重复；rank 并列同名次且后续跳号；dense_rank 并列同名次但后续不跳号。三者都需要 over 中定义分区和排序。'},
      {c:'hive',t:'SQL 性能优化',tag:'高频',s:'先减少输入，再减少 Shuffle，最后处理倾斜与文件布局。',q:'拿到一条慢 SQL，你如何系统排查？',key:'扫描 → Shuffle → 倾斜',a:'先看执行计划和扫描量，确认分区裁剪、列裁剪、谓词下推是否生效；再看 Join 顺序、Shuffle 数据量与并行度；最后检查长尾 Task、数据倾斜、小文件和资源配置。优化后用同一数据量对比验证。'},
      {c:'spark',t:'RDD、DataFrame、Dataset',tag:'基础',s:'RDD 灵活底层；DataFrame 有结构、优化强；Dataset 兼具类型安全（Scala/Java）。',q:'为什么业务开发更常使用 DataFrame？',key:'结构信息 + Catalyst',a:'DataFrame 带 Schema，Catalyst 能做谓词下推、列裁剪、常量折叠、Join 选择等优化，并由 Tungsten 改善内存与代码生成。RDD 缺少结构信息，很多优化只能由开发者手工完成。'},
      {c:'spark',t:'DAG、Stage 与 Task',tag:'高频',s:'Job 按 Shuffle 边界切 Stage；Stage 按分区生成 Task。',q:'Spark 如何划分 Stage？',key:'宽依赖是边界',a:'遇到 Shuffle 的宽依赖时切分 Stage；窄依赖可在同一 Stage 中流水线执行。每个 Stage 的 Task 数通常由其输入分区数决定。Action 会触发 Job，Job 再展开为 Stage 和 Task。'},
      {c:'spark',t:'宽依赖与窄依赖',tag:'原理',s:'窄依赖可局部恢复；宽依赖需要 Shuffle，是 Stage 切分依据。',q:'repartition 和 coalesce 有什么区别？',key:'是否 Shuffle',a:'repartition 一定 Shuffle，可增可减分区，分布更均匀；coalesce 默认不 Shuffle，通常用于减少分区，成本低但可能造成分区不均。若最终输出小文件过多，可谨慎减少分区。'},
      {c:'spark',t:'Spark 数据倾斜',tag:'高频',s:'少数 Key 承担大量数据，导致个别 Task 极慢或 OOM。',q:'Spark 数据倾斜如何定位和处理？',key:'确认 Key → 分散热点',a:'通过 Spark UI 看 Task 时长、Shuffle Read 和数据量是否长尾，再统计 Key 分布。处理可用热点 Key 加随机前缀两阶段聚合、广播小表、拆分热点 Key、提高并行度，或启用 AQE 倾斜 Join。'},
      {c:'spark',t:'Cache 与 Checkpoint',tag:'原理',s:'Cache 为复用提速但保留血缘；Checkpoint 截断血缘并提供更可靠存储。',q:'Cache 和 Checkpoint 的区别？',key:'性能复用 / 容错截断',a:'Cache/Persist 把计算结果保存在内存或磁盘，丢失后可依据血缘重算；Checkpoint 把数据写入可靠存储并截断血缘，适合血缘过长或迭代计算。Checkpoint 前先 Cache 可避免重复计算。'},
      {c:'flink',t:'事件时间与处理时间',tag:'基础',s:'事件时间反映业务发生时刻；处理时间反映算子处理时刻。',q:'实时统计为什么常用事件时间？',key:'结果可重现',a:'网络延迟或故障会让数据到达顺序变化，处理时间统计的窗口结果可能漂移；事件时间依据数据自身时间戳，配合 Watermark 处理乱序，更贴近业务事实且结果更可重现。'},
      {c:'flink',t:'Watermark 与迟到数据',tag:'高频',s:'Watermark 表示“系统认为某时间之前的数据大概率已到齐”。',q:'Watermark 是什么？迟到数据怎么处理？',key:'进度估计 + 容忍乱序',a:'Watermark 随事件时间推进并允许一定乱序，窗口在 Watermark 超过结束时间时触发。可设置 allowed lateness 接收一定范围迟到数据，超出范围的数据写入侧输出，后续补算或修正。'},
      {c:'flink',t:'Checkpoint 与 Exactly-once',tag:'高频',s:'一致性快照保存状态；端到端精确一次还要求 Source 可回放、Sink 可事务或幂等。',q:'Flink 如何实现 Exactly-once？',key:'快照 + 可回放 + 事务 Sink',a:'Barrier 随数据流传播，算子对状态做一致性快照；失败后从快照恢复状态并重放 Source。要实现端到端 Exactly-once，Sink 还需支持两阶段提交、事务或可靠幂等，不能只看 Flink 内部状态。'},
      {c:'flink',t:'状态与 State Backend',tag:'原理',s:'状态让流计算记住历史；大状态常用 RocksDB 类后端并做增量快照。',q:'有状态计算和无状态计算如何区分？',key:'是否依赖历史事件',a:'Map 这类仅依赖当前记录的操作通常无状态；去重、窗口聚合、会话计算需要记住之前事件，因此有状态。状态必须按 Key 划分、配置 TTL，并通过 Checkpoint 保证故障恢复。'},
      {c:'kafka',t:'Topic、Partition、Replica',tag:'基础',s:'Partition 提供并行和有序日志；Replica 提供容灾。',q:'Kafka 为什么要分区？',key:'扩展吞吐 + 局部有序',a:'一个 Topic 拆成多个 Partition 后可分布在多台 Broker 上并行读写，提升吞吐和扩展性。Kafka 只保证单分区内有序，因此需要同序消息使用稳定 Key 路由到同一分区。'},
      {c:'kafka',t:'消费者组与 Rebalance',tag:'高频',s:'同组内一个分区同一时刻只由一个消费者处理；成员或分区变化会重平衡。',q:'消费者数可以超过分区数吗？',key:'可以，但会空闲',a:'可以，但同一消费者组中，一个分区同一时刻只能分配给一个消费者，因此超过分区数的消费者没有任务。提高消费者数前应先确认 Partition 数是否足够。'},
      {c:'kafka',t:'消息可靠性',tag:'高频',s:'生产端 ACK + Broker 副本 + 消费端位点共同决定可靠性。',q:'Kafka 如何尽量避免消息丢失？',key:'三端一起看',a:'生产端使用合适的 acks、重试和幂等生产者；Broker 配置足够副本与最小同步副本；消费端处理成功后再提交 Offset，并保证下游幂等。可靠性是端到端问题，不能只调整一个参数。'},
      {c:'kafka',t:'积压排查',tag:'场景',s:'比较生产与消费速率，观察 Lag、分区分布、下游耗时和错误重试。',q:'Kafka 消息积压怎么处理？',key:'定位瓶颈 → 扩吞吐',a:'先确认是突发流量还是消费变慢，查看各分区 Lag 是否均匀；检查消费者 CPU、GC、网络、批次和下游写入。可临时扩消费者（不超过有效分区数）、提升批处理效率、扩分区，并从根因上优化慢操作。'},
      {c:'database',t:'B+ 树索引',tag:'高频',s:'高扇出降低树高，叶子有序且相连，适合范围查询。',q:'MySQL 为什么常用 B+ 树做索引？',key:'低树高 + 范围扫描',a:'B+ 树非叶子节点只存键和指针，单页可容纳更多键，树高更低、磁盘 IO 更少；数据集中在叶子节点且叶子链表有序，点查稳定，也适合范围扫描。'},
      {c:'database',t:'联合索引与最左前缀',tag:'高频',s:'联合索引按字段顺序排序，可使用从最左列开始的连续前缀。',q:'联合索引 (a,b,c)，哪些条件能利用索引？',key:'先看最左列，再看范围',a:'包含 a 的等值条件通常可继续利用 b、c；缺少 a 时一般无法按该联合索引有效定位。遇到范围条件后，后续列通常不能继续用于缩小扫描范围，但可能用于索引下推或覆盖查询，需结合执行计划确认。'},
      {c:'database',t:'事务与 ACID',tag:'基础',s:'原子性、一致性、隔离性、持久性共同保证事务可靠。',q:'ACID 分别是什么？',key:'全成全败 / 正确状态 / 互不干扰 / 提交不丢',a:'原子性保证操作要么全成要么全败；一致性保证约束从一个正确状态到另一个；隔离性降低并发事务互相影响；持久性保证提交后的结果即使宕机也能恢复。'},
      {c:'database',t:'隔离级别与 MVCC',tag:'高频',s:'从读未提交到串行化，隔离更强但并发成本更高。',q:'可重复读如何减少并发读写冲突？',key:'快照读 + 版本链',a:'MVCC 为记录保留版本信息，普通快照读按事务视图读取合适版本，读通常不阻塞写。当前读仍需加锁。MySQL InnoDB 在可重复读下还结合间隙锁等机制处理当前读的幻读问题。'},
      {c:'computer',t:'进程、线程与协程',tag:'基础',s:'进程是资源隔离单位；线程是 CPU 调度单位；协程是用户态轻量调度。',q:'进程和线程有什么区别？',key:'资源隔离 / 调度执行',a:'进程有独立地址空间，隔离强但切换和通信成本较高；同进程线程共享大部分资源，通信方便但一个线程出错可能影响整个进程。协程由用户态运行时调度，适合大量 IO 并发。'},
      {c:'computer',t:'TCP 三次握手与四次挥手',tag:'高频',s:'握手确认双方收发能力与序号；挥手因双向通道独立关闭通常需要四次。',q:'TCP 为什么是三次握手？',key:'双方确认收发能力',a:'第一次客户端发 SYN；第二次服务端回 SYN+ACK，说明服务端收发正常；第三次客户端回 ACK，使服务端确认客户端能收到响应。两次不足以让服务端确认客户端接收能力，也不利于避免历史连接请求造成误连接。'},
      {c:'computer',t:'Linux 性能排查',tag:'工程',s:'先定资源维度，再找进程与调用：CPU、内存、磁盘、网络。',q:'服务器变慢，你会用哪些命令排查？',key:'资源 → 进程 → 日志',a:'用 top/htop 看负载与进程，free 看内存，vmstat 看运行队列与换页，iostat 看磁盘等待，df/du 看空间，ss 看连接，pidstat 定位具体进程，再结合日志和监控确认时间点。不要只背命令，要说明判断依据。'},
      {c:'computer',t:'DNS 与 HTTP 请求链路',tag:'网络',s:'域名解析 → 建连/TLS → 请求 → 服务端处理 → 响应与渲染。',q:'浏览器输入 URL 后发生了什么？',key:'DNS → TCP/TLS → HTTP',a:'先查缓存并做 DNS 解析获得 IP；建立 TCP 连接，HTTPS 还要进行 TLS 握手；发送 HTTP 请求，经网关或负载均衡到服务端；服务端处理并返回响应，浏览器解析资源并渲染。可继续展开缓存、连接复用与 CDN。'},
      {c:'governance',t:'任务调度与依赖',tag:'工程',s:'DAG 表达上下游；必须关注重试、幂等、补数、优先级和 SLA。',q:'如何设计一个可靠的日批任务？',key:'依赖 + 幂等 + 可观测',a:'明确数据就绪条件和上下游依赖；输出按分区覆盖或事务写保证幂等；配置合理重试、超时和失败告警；记录行数、耗时与质量指标；支持按业务日期重跑和补数，并控制并发避免冲击源系统。'},
      {c:'governance',t:'数据质量体系',tag:'高频',s:'完整性、唯一性、准确性、一致性、及时性是常见检查维度。',q:'如何保障数仓数据质量？',key:'事前规则 + 事中监控 + 事后追溯',a:'在接入和建模阶段定义口径、Schema 和质量规则；运行中监控空值率、唯一性、波动、对账和延迟；异常时阻断下游或降级，依靠血缘快速定位，并通过补数修复。重要指标要有负责人和 SLA。'},
      {c:'governance',t:'数据血缘与元数据',tag:'治理',s:'元数据描述“数据是什么”；血缘描述“数据从哪里来、流向哪里”。',q:'数据血缘有什么价值？',key:'影响分析 + 故障定位',a:'字段或表变更前可评估影响范围；指标异常时可沿上游定位；权限审计时可追踪敏感数据流向；也能帮助发现重复链路和无人使用的数据资产。血缘应尽量细化到字段级并与调度状态结合。'},
      {c:'governance',t:'实时数仓架构',tag:'场景',s:'CDC/日志 → Kafka → Flink → 湖仓/OLAP；同时处理状态、乱序和一致性。',q:'设计实时订单指标链路要考虑什么？',key:'口径 + 时间 + 一致性 + 容灾',a:'先定义订单事件和指标口径；用 CDC 或日志进入 Kafka，Flink 按事件时间处理乱序、去重和聚合；结果写入支持幂等或事务的存储。还要设计维表关联、状态 TTL、Checkpoint、迟到修正、监控与离线对账。'},
      {c:'governance',t:'离线与实时一体化',tag:'架构',s:'目标是减少两套口径与链路；常见方向是湖仓、流批统一和统一指标层。',q:'Lambda 与 Kappa 架构怎么理解？',key:'双链路 / 流式统一',a:'Lambda 同时保留离线批处理与实时速度层，容错清晰但维护两套逻辑；Kappa 尽量把历史和实时都当作流重放，架构更统一，但要求消息长期保存和流作业具备强重放能力。选择取决于业务、团队和基础设施。'}
    ];
    ITEMS.push(
      {c:'warehouse',t:'一致性维度与总线矩阵',tag:'牛客高频',s:'用共享维度把多个业务过程连接起来，总线矩阵明确“业务过程 × 维度”的关系。',q:'什么是一致性维度、总线矩阵？',key:'共享口径 + 过程规划',a:'一致性维度是被多个事实表复用、编码和属性含义保持统一的维度，例如全公司统一的日期、用户、商品维度。总线矩阵用行表示业务过程、列表示公共维度，帮助规划主题域、识别复用关系并避免烟囱式建模。',src:'https://www.nowcoder.com/discuss/353159520220291072'},
      {c:'warehouse',t:'数仓冗余与一致性',tag:'牛客高频',s:'数仓允许为查询效率保留冗余，但必须用口径、血缘、调度和质量校验控制一致性。',q:'数据库减少冗余，数仓却常有冗余，如何保证一致性？',key:'单一口径源 + 同批次 + 对账',a:'先规定公共明细或汇总层是唯一可信来源，ADS 不自行重复计算核心口径；再用统一调度批次、幂等覆盖、版本管理保证同批数据；最后做主键、行数、金额和波动对账，并通过血缘定位受影响下游。',src:'https://www.nowcoder.com/feed/main/detail/90cb58c0732b44e3884aae61cbf58c8e'},
      {c:'warehouse',t:'数据域与主题划分',tag:'牛客高频',s:'数据域按稳定业务过程划分，主题是面向分析对象组织的数据集合。',q:'数据域和主题域应该依据什么划分？',key:'业务过程稳定，组织架构可变',a:'优先围绕交易、履约、流量、会员等稳定业务过程划分数据域，不直接照搬经常变化的部门架构；主题则围绕用户、商品、订单等分析对象组织跨过程数据，并由总线矩阵检查边界和共享维度。',src:'https://www.nowcoder.com/feed/main/detail/df79ce7827254e7c832d4365964abaac'},
      {c:'hdfs',t:'Map 端小文件治理',tag:'牛客高频',s:'过高并行度、动态分区和频繁微批写入都会制造小文件。',q:'Map 端或写入端为什么产生小文件？如何治理？',key:'控制输入切片 + 控制输出并行度',a:'输入侧大量小源文件会产生很多 Map；输出侧动态分区、过高并行度和频繁小批写会产生小文件。可在采集端合批、使用 CombineInputFormat、合理设置 Shuffle 分区、写前 coalesce/repartition，并用周期性 Compaction 合并。',src:'https://www.nowcoder.com/feed/main/detail/90cb58c0732b44e3884aae61cbf58c8e'},
      {c:'hive',t:'窗口函数与聚合函数的差异',tag:'牛客高频',s:'聚合函数减少行数；窗口函数在保留明细行的同时计算分组统计。',q:'同样是 max()，窗口函数和聚合函数有什么区别？',key:'是否改变粒度',a:'group by + max 会把每组压成一行，结果粒度改变；max() over(partition by ...) 会把分组最大值附到每条明细上，行数通常不变。选择关键在于最终是否还需要保留明细字段。',src:'https://www.nowcoder.com/discuss/388707339937873920'},
      {c:'hive',t:'SQL：去掉极值再求平均',tag:'牛客真题',s:'先在组内定位最高最低记录，再排除并聚合，注意并列极值的业务口径。',q:'如何去掉每个部门最高、最低工资后求平均？',key:'排名/极值 → 过滤 → 聚合',a:'可先按部门计算 max、min 再过滤 salary not in (max,min)，也可用 dense_rank 正反排序后排除首名。面试时必须追问：并列最高或最低是全部去掉，还是只去掉一行？不同口径决定用 dense_rank 还是 row_number。',src:'https://www.nowcoder.com/discuss/388707339937873920'},
      {c:'database',t:'列式存储为什么适合分析',tag:'牛客高频',s:'只读取需要列，同列数据类型一致、压缩率高，并利于向量化执行。',q:'列式存储为什么在 OLAP 查询中更快？',key:'少读列 + 高压缩 + 向量化',a:'分析查询常只访问少数列，列存能避免读取无关字段；同列值相似，编码和压缩效果更好，进一步减少 IO；连续同类型数据也更适合 CPU 缓存和向量化计算。但点查整行或频繁更新通常不是其强项。',src:'https://www.nowcoder.com/discuss/388707339937873920'},
      {c:'governance',t:'分层生命周期治理',tag:'牛客高频',s:'不同层价值和可重建性不同，保留周期不能一刀切。',q:'生命周期治理是否每层都不同？需要考虑什么？',key:'价值 + 可重建 + 访问热度 + 合规',a:'ODS 原始数据要看审计与重放需求，DWD 公共明细通常保留更久，DWS/ADS 若可由上游重建可缩短。决策还要看访问频率、恢复成本、法规、SLA 和存储价格，并设置观察期与回收机制。',src:'https://www.nowcoder.com/feed/main/detail/90cb58c0732b44e3884aae61cbf58c8e'},
      {c:'governance',t:'任务产出延迟排查',tag:'牛客场景',s:'沿 Source → 计算 → Sink → 调度依赖逐段定位，区分数据晚到和计算变慢。',q:'一个核心任务今天产出很晚，你如何排查？',key:'基线对比 + 关键路径 + 长尾节点',a:'先确认上游是否按时就绪、任务何时真正开始；再与历史基线比较扫描量、Shuffle、长尾 Task、GC 和失败重试；检查资源队列是否拥堵、下游写入是否变慢。最后给出止血方案、补数范围和长期监控阈值。',src:'https://www.nowcoder.com/creation/subject/ed8af029d6a34efa9b34badd9a99cd6e'},
      {c:'flink',t:'实时链路延迟治理',tag:'牛客场景',s:'延迟可能来自 Source 积压、算子背压、状态膨胀或 Sink 吞吐不足。',q:'实时任务如何保证低延迟？',key:'Source → Operator → Sink',a:'先按峰值 QPS 规划分区和并行度，监控 Kafka Lag 与 Source 消费速率；中间算子关注背压、热点 Key、Checkpoint 时长和状态大小；Sink 使用批量、异步和幂等写。发生故障时从可靠 Checkpoint 恢复，不能为了“追最新”直接丢弃未处理 Offset。',src:'https://www.nowcoder.com/feed/main/detail/df79ce7827254e7c832d4365964abaac'}
    );

    ITEMS.push(
      {c:'warehouse',t:'怎样评价一个数仓模型',tag:'五星高频',s:'好模型不仅查询快，还应口径清楚、粒度稳定、可复用、可扩展且可治理。',q:'你觉得怎样的数仓模型才是好的模型？',key:'准确 + 易懂 + 复用 + 扩展 + 成本',a:'首先粒度和业务口径清楚，能正确还原业务；其次公共维度和指标可复用，下游不必重复加工；面对新增业务可通过扩展维度或事实平滑演进；同时具备血缘、质量规则和合理生命周期，查询性能与维护成本可控。',origin:'30+ 场真实面经整理'},
      {c:'warehouse',t:'DWD 与 DWS 的边界',tag:'五星高频',s:'DWD 保持业务过程明细，DWS 围绕分析主题做公共轻度汇总。',q:'DWD 和 DWS 的核心区别是什么？',key:'业务过程明细 / 主题公共汇总',a:'DWD 的一行通常对应一个最细业务事件，负责清洗、标准化和统一编码；DWS 在可信明细上按主题、对象或周期做公共聚合，服务复用指标。判断某逻辑放哪层，关键看是否改变事实粒度以及是否被多个应用复用。',origin:'30+ 场真实面经整理'},
      {c:'warehouse',t:'维度退化',tag:'高频建模',s:'把订单号等业务标识直接保留在事实表，避免为无描述属性的维度单独建表。',q:'什么是维度退化？为什么要这样做？',key:'业务标识留在事实表',a:'当某个维度只有业务主键而几乎没有其他描述属性，例如订单号、支付流水号，可以直接放入事实表而不单建维度表。这样既保留明细查询和串联能力，又减少无意义 Join。',origin:'30+ 场真实面经整理'},
      {c:'warehouse',t:'漏斗分析建模',tag:'场景题',s:'围绕用户、会话和步骤事件建明细事实，再统一步骤定义、窗口和去重口径。',q:'做一个注册—浏览—加购—支付漏斗，需要设计哪些表？',key:'事件明细 + 步骤维度 + 统一窗口',a:'先建设统一事件明细事实表，粒度是一名用户的一次事件，保留事件时间、会话、渠道和业务对象；再维护漏斗步骤维度，定义步骤顺序和有效规则；汇总层按用户/会话识别步骤到达与转化，明确跨天窗口、重复事件和顺序回退的处理。',origin:'30+ 场真实面经整理'},
      {c:'warehouse',t:'快照数据与事务事实',tag:'高频建模',s:'事实表还原发生过什么；快照表回答某个时点处于什么状态。',q:'什么时候用快照数据，什么时候用事务事实数据？',key:'过程 / 状态',a:'需要追溯订单、支付等业务事件并聚合发生额时使用事务事实；需要回答某日库存、余额、会员状态等时点状态或周期对比时使用快照表。若既要过程又要状态，通常两类表并存，不能用每日快照完全替代事件明细。',origin:'30+ 场真实面经整理'},
      {c:'governance',t:'统一配置 DQC',tag:'五星高频',s:'用规则模板、元数据标签和分层基线，把大量表的质量校验平台化。',q:'大量 DWD 和画像表，如何统一配置 DQC 规则？',key:'模板化 + 元数据驱动 + 分级',a:'先把非空、唯一、枚举、波动、对账、及时性等规则模板化；根据表层级、字段类型、主键和敏感标签自动推荐或生成规则；核心表设置强阻断和严格 SLA，普通表告警即可；同时保留阈值版本、负责人和历史基线，减少逐表手工维护。',origin:'30+ 场真实面经整理'},
      {c:'governance',t:'非代码类指标异常排查',tag:'五星高频',s:'从口径、源数据、维度变化、迟到和业务事件五条线排查。',q:'数据指标异常但代码没有变化，应该如何排查？',key:'基线 → 分维度 → 沿血缘 → 找业务解释',a:'先确认异常时间与幅度，并和历史、同比及同类指标比较；按渠道、地区、端、业务类型下钻定位贡献维度；沿血缘检查源数据量、枚举变化、延迟和任务批次；再确认活动、灰度、政策等真实业务变化，最后记录结论并补充监控。',origin:'30+ 场真实面经整理'},
      {c:'governance',t:'模型迭代一致性验证',tag:'五星高频',s:'新旧模型在最细可比粒度对齐，再逐级汇总比较指标。',q:'表口径迭代时，如何保证新旧模型指标一致？',key:'同批数据 + 最细粒度对比 + 差异归因',a:'固定同一输入批次和时间范围，在业务主键或最细维度组合上 Full Join 新旧结果，对比缺失、多出和度量差值；再逐层聚合到报表口径核对。对预期变化建立白名单，灰度并行一段时间后再切下游。',origin:'30+ 场真实面经整理'},
      {c:'governance',t:'SLA 与告警分级',tag:'五星高频',s:'不是所有任务同一等级；按业务影响、恢复时限和依赖范围分级。',q:'哪些任务需要定 SLA？SLA 应如何分级？',key:'业务影响 + 最晚完成 + 恢复目标',a:'核心经营报表、监管、推荐特征和大量下游依赖任务应明确 SLA。可以按影响范围和最晚可用时间分 P0/P1/P2，分别定义完成时刻、告警提前量、负责人、升级链路和恢复目标；上游未就绪与自身运行超时应分开监控。',origin:'30+ 场真实面经整理'},
      {c:'governance',t:'回刷与补数安全',tag:'工程高频',s:'先确定影响范围和幂等性，再隔离下游、重跑、对账并恢复调度。',q:'全量分区采用增量 Merge，数据出错后回刷要注意什么？',key:'基线分区 + 增量顺序 + 幂等 + 下游隔离',a:'确认错误起始日，因为后续全量分区继承昨日结果，通常需要从正确基线开始按日期顺序重放；补齐每一天增量并保证 Merge 幂等；回刷期间暂停或隔离下游消费；完成后做主键、行数、金额和抽样对账，再恢复调度。',origin:'30+ 场真实面经整理'},
      {c:'hive',t:'Session 切分',tag:'五星 SQL',s:'用 lag 计算相邻事件间隔，超阈值打新会话标记，再累计得到 session_id。',q:'用户事件间隔超过 30 分钟算新 Session，SQL 怎么写？',key:'lag → 超阈值打标 → 累计分组',a:'先按用户和事件时间排序，用 lag 得到上一事件时间；首次事件或时间差超过 30 分钟时记 flag=1，否则为 0；再对 flag 做 sum over 累计得到 session_id，最后按 uid、session_id 聚合开始时间、结束时间与事件数。',origin:'30+ 场真实面经整理'},
      {c:'hive',t:'区间合并',tag:'五星 SQL',s:'不能只与上一行结束点比较，应维护“之前区间的最大结束点”判断是否断开。',q:'多个重叠时间区间如何合并？',key:'累计最大结束点 → 断点标记 → 分组',a:'按 start 排序，计算当前行之前所有区间的 max(end)；若当前 start 大于此前最大 end，说明开启新组并标 1，否则仍在旧组；累计标记得到组号，最后按组取 min(start)、max(end)。用 lag(end) 只比较上一行，在嵌套区间时可能出错。',origin:'30+ 场真实面经整理'},
      {c:'hive',t:'Count Distinct 优化',tag:'五星高频',s:'核心是降低单点去重压力，可预聚合、分桶、两阶段去重或使用近似算法。',q:'count(distinct) 为什么慢？有哪些优化方法？',key:'全局去重 Shuffle + 单点压力',a:'精确去重需要把相同 Key 汇聚到一起，数据量大或 Key 集中时 Shuffle 和状态很重。可先按分区/桶做局部 distinct 再全局聚合，使用 group by 替代单 Reduce 路径，按业务拆分热点；若允许误差，可使用 HyperLogLog、Bitmap 等近似或集合结构。',origin:'30+ 场真实面经整理'},
      {c:'spark',t:'AQE 自适应执行',tag:'四星高频',s:'运行时基于真实 Shuffle 统计重新优化分区和 Join 策略。',q:'Spark AQE 主要解决什么问题？',key:'运行时统计 → 动态改计划',a:'静态优化依赖估算，实际数据可能偏差很大。AQE 在 Shuffle 后利用真实统计合并过小分区、拆分或处理倾斜分区，并在条件满足时把 Sort Merge Join 转成广播 Join，从而减少小 Task、长尾和不必要 Shuffle。',origin:'30+ 场真实面经整理'},
      {c:'spark',t:'Spark Join 策略',tag:'四星高频',s:'Broadcast Hash、Shuffle Hash、Sort Merge 的选择取决于大小、内存、排序与分区。',q:'Spark 常见 Join 策略及适用场景？',key:'小表广播 / Hash 分区 / 排序合并',a:'Broadcast Hash Join 把小表广播到各节点，避免大表 Shuffle；Shuffle Hash Join 对两侧按 Key 重分区并在每个分区建 Hash，适合一侧分区后较小；Sort Merge Join 两侧 Shuffle 并排序后归并，适合大表等值 Join，稳定但网络和排序成本较高。',origin:'30+ 场真实面经整理'},
      {c:'spark',t:'Spark OOM 定位',tag:'四星场景',s:'分别从读取膨胀、计算状态/广播和写出单分区三个方向定位。',q:'Spark OOM 如何系统定位和解决？',key:'读、算、写三段定位',a:'读侧检查单文件/分区过大、反序列化和缓存；计算侧检查广播表过大、聚合状态、数据倾斜和 Cartesian Join；写侧检查单分区输出、collect/toPandas 等拉回 Driver。结合 Spark UI 看失败 Executor、Task 输入与 GC，再从分区、算法和数据分布上修复。',origin:'30+ 场真实面经整理'},
      {c:'database',t:'ClickHouse 与 Doris/StarRocks',tag:'四星热点',s:'都面向 OLAP，但在明细分析、更新模型、Join 和实时服务能力上侧重点不同。',q:'ClickHouse 和 Doris/StarRocks 如何选型？',key:'查询模型 + 更新需求 + Join + 运维',a:'ClickHouse 擅长高吞吐写入和单表/宽表聚合，生态成熟但复杂更新与多表服务要谨慎；Doris/StarRocks 更强调 MySQL 协议、实时更新、物化视图和多表 Join 的易用性。选型应以数据更新方式、并发、Join 复杂度、延迟和团队运维能力实测。',origin:'30+ 场真实面经整理'},
      {c:'database',t:'ORC 与 Parquet',tag:'四星热点',s:'两者都是列式格式；ORC 在 Hive 生态和统计索引上深入，Parquet 跨引擎兼容性强。',q:'ORC 和 Parquet 的结构与选型差异？',key:'列式分组 + 元数据 + 生态',a:'ORC 以 Stripe 组织数据，包含列统计、索引和 Footer，在 Hive 场景常有良好谓词下推与压缩；Parquet 以 Row Group、Column Chunk、Page 组织，跨 Spark、Flink、湖仓生态兼容广。实际要比较引擎支持、嵌套类型、压缩、读写性能和下游生态。',origin:'30+ 场真实面经整理'},
      {c:'flink',t:'Flink 反压治理',tag:'三星高频',s:'下游处理不及导致压力向上游传播，需定位瓶颈算子而不是盲目扩容。',q:'Flink 出现反压如何排查和处理？',key:'定位瓶颈算子 → 判断 CPU/IO/倾斜/状态',a:'从监控定位反压链路和最下游首个忙算子，检查 busy、backpressure、吞吐、Checkpoint、GC 和状态大小；若 CPU 重则优化函数或加并行度，IO 重使用批量/异步写，Key 倾斜则重分布热点，状态膨胀则配置 TTL 和增量快照。',origin:'30+ 场真实面经整理'},
      {c:'flink',t:'实时离线口径一致',tag:'三星场景',s:'共享口径与维度、可重放原始数据，并用离线结果对账修正实时结果。',q:'Lambda 架构下如何保证实时与离线数据一致？',key:'同定义 + 同源 + 对账 + 修正',a:'指标公式、维度映射和去重主键尽量共用；实时与离线基于同一原始事件和事件时间语义；实时侧处理迟到、乱序和幂等，离线侧产出权威结果后按主键/分区对账，并通过覆盖或补偿流修正差异。',origin:'30+ 场真实面经整理'},
      {c:'computer',t:'超大文件集合求交',tag:'算法场景',s:'单机内存放不下时先用相同 Hash 规则分桶，再逐桶求交。',q:'两个超大文本文件，如何找共同单词？',key:'Hash 分桶 + 小集合求交',a:'对单词使用同一 Hash 规则写入 N 个对应小文件，使相同单词一定进入同号桶；逐个读取 A_i 和 B_i，在内存中用 HashSet 求交并输出。需要处理数据倾斜、重复词、哈希冲突以及临时文件磁盘空间。',origin:'30+ 场真实面经整理'},
      {c:'governance',t:'项目介绍的结构化表达',tag:'必考软题',s:'先用业务目标定调，再说规模、职责、难点、方案和量化结果。',q:'请介绍一个你最有代表性的数据仓库项目。',key:'背景目标 → 规模职责 → 难点方案 → 结果反思',a:'用一句话说明业务目标和使用者；交代数据规模、技术栈和个人边界；选择一个最能体现判断力的难点，说明方案对比与取舍；最后给出时效、成本、质量或使用人数等量化结果，并补充如果重做会改进什么。',origin:'30+ 场真实面经整理'}
    );

    ITEMS.push(
      {c:'hadoop',t:'Hadoop 整体架构',tag:'五星高频',s:'Hadoop 是分布式数据处理生态：HDFS 管存储，YARN 管资源，MapReduce 管批计算。',q:'请系统介绍 Hadoop，它的核心组件分别解决什么问题？',key:'存储 HDFS → 资源 YARN → 计算 MapReduce',a:'HDFS 把大文件切成 Block 分布存储并通过副本容错；YARN 用 ResourceManager、NodeManager、ApplicationMaster 和 Container 统一管理集群资源；MapReduce 把批任务拆为 Map 与 Reduce，并由框架完成切片、调度、Shuffle 和失败重试。Hive、Spark 等组件可以在这一基础设施之上工作。',src:'https://www.nowcoder.com/discuss/353159520220291072'},
      {c:'hadoop',t:'Hadoop、Hive 与 Spark 的关系',tag:'牛客高频',s:'Hadoop 提供基础设施，Hive 提供 SQL 与元数据抽象，Spark 提供通用计算引擎。',q:'Hadoop、Hive、Spark 有什么区别和关系？',key:'平台 / SQL 层 / 计算引擎',a:'Hadoop 通常指 HDFS、YARN、MapReduce 等基础组件；Hive 把表和 SQL 转换为底层执行计划，本身不是独立分布式存储；Spark 是内存友好的通用计算引擎，可读取 HDFS、使用 Hive Metastore，并运行在 YARN 上。三者不是互相替代，而是处于不同层次。',src:'https://www.nowcoder.com/feed/main/detail/61f8d0a985a1438bb1a3b2baf1302b51'},
      {c:'hadoop',t:'MapReduce 执行模型',tag:'五星高频',s:'输入切片并行 Map，Shuffle 按 Key 重分布，Reduce 聚合后写出。',q:'请描述 MapReduce 的完整执行流程。',key:'Split → Map → Shuffle → Reduce → Output',a:'InputFormat 生成 InputSplit，RecordReader 转成键值记录；Map 并行处理后先写环形缓冲区，溢写时分区、排序并落盘；Reduce 端主动拉取各 Map 的对应分区，归并排序，把相同 Key 的值交给 reduce()，最后通过 OutputFormat 写入文件系统。',src:'https://www.nowcoder.com/discuss/475594795038134272'},
      {c:'hadoop',t:'MapReduce Shuffle',tag:'五星高频',s:'Map 端分区、排序、溢写与合并；Reduce 端拉取、归并后按 Key 分组。',q:'MapReduce Shuffle 具体做了什么？',key:'Map 端排序落盘 + Reduce 端拉取归并',a:'Map 输出先进入内存缓冲区，达到阈值后按 Partition 排序并 Spill 到本地磁盘，多次 Spill 再归并；Reduce Task 通过网络拉取属于自己的分区，在内存和磁盘中归并排序，最后按 Key 分组交给 Reduce 函数。Shuffle 常是网络、磁盘和序列化瓶颈。',src:'https://www.nowcoder.com/discuss/353158028356689920'},
      {c:'hadoop',t:'Partitioner 与 Combiner',tag:'高频原理',s:'Partitioner 决定 Key 去哪个 Reduce；Combiner 在 Map 端做可安全合并的局部聚合。',q:'Partitioner 和 Combiner 分别有什么作用？Combiner 一定执行吗？',key:'路由 / 局部聚合',a:'Partitioner 按 Key 计算目标 Reduce 分区，决定负载分布和同 Key 汇聚；Combiner 可减少网络传输，但框架不保证其执行次数，可能执行零次或多次，因此只能用于满足结合律、交换律且不影响最终结果的操作，例如 sum，不能直接用于平均值。',src:'https://www.nowcoder.com/discuss/353159520220291072'},
      {c:'hadoop',t:'数据本地性与推测执行',tag:'原理',s:'优先把计算调度到数据所在节点；慢任务可启动备份实例，以先完成者为准。',q:'Hadoop 为什么强调数据本地性？推测执行适合什么场景？',key:'移动计算 / 处理偶发慢节点',a:'大数据跨网络搬运成本很高，因此调度器优先选择数据本地、机架本地，再考虑跨机架。推测执行会为明显落后的 Task 启动备份实例，适合硬件抖动等偶发慢任务；若任务本身数据倾斜或向外部系统写入，推测执行可能浪费资源或产生重复副作用。',origin:'Hadoop 官方文档与牛客高频题'},
      {c:'hadoop',t:'YARN 核心角色',tag:'五星高频',s:'ResourceManager 管全局资源，NodeManager 管节点，ApplicationMaster 管单应用，Container 承载任务。',q:'YARN 的核心组件及职责是什么？',key:'RM / NM / AM / Container',a:'ResourceManager 负责全局资源仲裁与应用入口；NodeManager 管理单机 Container 并上报资源；每个应用的 ApplicationMaster 向 RM 申请资源、协调和监控任务；Container 是 CPU、内存等资源配额与进程运行环境。',src:'https://www.nowcoder.com/discuss/353159630853447680'},
      {c:'hadoop',t:'YARN 作业提交流程',tag:'五星高频',s:'客户端提交资源 → RM 启动 AM → AM 申请 Container → NM 启动任务 → 汇报完成。',q:'一个 Hadoop 作业提交到 YARN 后经历哪些步骤？',key:'提交 → 启动 AM → 申请 Container → 执行监控',a:'客户端向 ResourceManager 申请 ApplicationId，并把 Jar、配置和切片信息上传到共享存储；RM 选择节点启动 ApplicationMaster；AM 注册并向调度器申请 Container；对应 NodeManager 启动 Task，AM 监控进度与失败重试，完成后注销并释放资源。',src:'https://www.nowcoder.com/discuss/353159520220291072'},
      {c:'hadoop',t:'YARN 调度器',tag:'高频原理',s:'FIFO 简单；Capacity 强调多队列容量与共享；Fair 强调一段时间内资源公平。',q:'YARN 常见调度器如何选择？',key:'FIFO / Capacity / Fair',a:'FIFO 按提交顺序执行，适合简单小集群；Capacity Scheduler 为组织或租户划队列和容量，同时允许空闲资源共享；Fair Scheduler 追求一段时间内应用获得公平资源。企业常结合队列容量、优先级、抢占、用户上限和 SLA 做配置。',src:'https://www.nowcoder.com/discuss/353159630853447680'},
      {c:'hadoop',t:'压缩与可切分性',tag:'高频工程',s:'压缩率、CPU 成本和能否 Split 要一起看；文件是否可切分影响 Map 并行度。',q:'Hadoop 常见压缩格式如何选？为什么可切分性重要？',key:'IO / CPU / Split',a:'Gzip 压缩率较好但普通 Gzip 文件不可切分；BZip2 可切分但 CPU 较重；Snappy、LZ4 更偏速度，常与 ORC/Parquet 的块结构配合。大文件不可切分会限制并行读取，因此选型要结合存储成本、网络 IO、CPU 和下游引擎。',src:'https://www.nowcoder.com/discuss/353159630853447680'},

      {c:'hdfs',t:'Block 大小设计',tag:'五星高频',s:'大 Block 减少元数据与寻址开销，又让单个任务有足够计算时间。',q:'HDFS 为什么使用较大的 Block？Block 越大越好吗？',key:'元数据 + 吞吐 + 并行度',a:'大 Block 能减少文件到块的映射数量、NameNode 元数据和磁盘寻址开销，适合顺序吞吐；但过大也会减少并行度、增加失败重算粒度。应结合文件规模、集群带宽和计算分区选择，不要把“默认值”当成永远正确的答案。',src:'https://www.nowcoder.com/discuss/353159520220291072'},
      {c:'hdfs',t:'FsImage、EditLog 与 Checkpoint',tag:'五星高频',s:'FsImage 是命名空间快照，EditLog 记录增量修改；Checkpoint 合并二者缩短恢复。',q:'NameNode 的 FsImage、EditLog、SecondaryNameNode 分别是什么？',key:'快照 + 增量日志 + 合并',a:'FsImage 保存某一时点的文件系统命名空间快照；EditLog 追加记录之后的元数据操作。Checkpoint 节点周期性获取二者并合并生成新镜像，避免 EditLog 无限增长。SecondaryNameNode 不是热备 NameNode，不能简单理解为主节点宕机后自动接管。',src:'https://www.nowcoder.com/discuss/353159520220291072'},
      {c:'hdfs',t:'NameNode HA',tag:'五星高频',s:'Active/Standby 共享编辑日志，ZKFC 监控选主，Fencing 防止双主写入。',q:'HDFS NameNode HA 如何实现？怎样避免脑裂？',key:'共享日志 + 自动切换 + Fencing',a:'Active NameNode 写 EditLog 到 JournalNode 仲裁组，Standby 持续同步并应用日志；ZKFC 借助 ZooKeeper 监控健康和主备选举。切换时必须通过 Fencing 隔离旧 Active，防止两个 NameNode 同时对外写元数据造成脑裂。',src:'https://www.nowcoder.com/discuss/457496886002352128'},
      {c:'hdfs',t:'SafeMode',tag:'高频原理',s:'NameNode 启动后先等待足够 Block 上报，在安全模式下通常不接受命名空间写操作。',q:'HDFS 为什么会进入安全模式？如何判断能否退出？',key:'块上报比例 + 只读保护',a:'NameNode 重启加载镜像和日志后，并不知道各副本当前真实位置，需要等待 DataNode 心跳和 BlockReport。当满足配置的安全块比例后自动退出。长期不退出应检查缺失块、DataNode 存活和阈值，而不是直接强制退出掩盖故障。',origin:'Hadoop 官方文档与牛客高频题'},
      {c:'hdfs',t:'HDFS Federation',tag:'进阶架构',s:'多个独立 NameNode 管理不同命名空间，共享 DataNode，缓解单命名空间扩展瓶颈。',q:'NameNode 内存成为瓶颈时，HDFS Federation 能解决什么问题？',key:'多命名空间横向扩展',a:'Federation 让多个 NameNode/Namespace 独立管理各自的 Block Pool，DataNode 可同时服务多个 Block Pool，从而扩展元数据容量并隔离部分工作负载。它解决横向扩展，不等同于 HA；每个命名空间仍需单独配置主备。',src:'https://www.nowcoder.com/discuss/457496886002352128'},
      {c:'hdfs',t:'副本恢复与节点下线',tag:'工程高频',s:'心跳丢失触发节点判死和补副本；计划下线应走 Decommission，避免同时丢失冗余。',q:'DataNode 宕机或计划下线时，HDFS 怎么处理？',key:'心跳检测 → 补副本 / Decommission',a:'NameNode 根据心跳判定节点不可用，把其上的 Block 标记为副本不足，并从健康副本复制到其他节点；计划下线应先进入 Decommission，让块副本迁移达到目标后再停机。Balancer 解决空间分布不均，但不能替代副本完整性检查。',origin:'Hadoop 官方文档与工程实践'},

      {c:'hive',t:'Hive 与传统数据库',tag:'五星高频',s:'Hive 是面向批量分析的 SQL/元数据层，不提供典型 OLTP 数据库的低延迟事务能力。',q:'Hive 和 MySQL 等传统数据库有什么区别？',key:'分析批处理 / 在线事务',a:'Hive 的表数据通常存于 HDFS 或对象存储，SQL 转成分布式任务，适合大规模扫描聚合；MySQL 面向低延迟点查、更新和事务。两者在存储管理、执行延迟、索引、约束和并发模型上不同，不能因为都能写 SQL 就认为用途相同。',src:'https://www.nowcoder.com/feed/main/detail/61f8d0a985a1438bb1a3b2baf1302b51'},
      {c:'hive',t:'UDF、UDAF、UDTF',tag:'牛客高频',s:'UDF 一进一出，UDAF 多行聚合一行，UDTF 一行展开多行或多列。',q:'Hive 的 UDF、UDAF、UDTF 有什么区别？',key:'标量 / 聚合 / 表生成',a:'UDF 对单行输入返回单值，例如脱敏；UDAF 对一组记录聚合，例如自定义去重统计；UDTF 把一行展开为多行或多列，例如 explode。选择时先判断输入输出粒度是否变化，并注意函数确定性和序列化成本。',src:'https://www.nowcoder.com/feed/main/detail/61f8d0a985a1438bb1a3b2baf1302b51'},
      {c:'hive',t:'动态分区与分区爆炸',tag:'高频工程',s:'动态分区方便批量路由，但高基数字段会制造目录和小文件，拖累元数据与调度。',q:'Hive 动态分区有什么风险？如何治理？',key:'限制分区数 + 合理粒度 + 文件合并',a:'动态分区按数据值自动创建目录，若字段基数过高或数据脏，会产生海量分区和小文件。应选择稳定、常用于裁剪的字段，限制单次动态分区数量，提前校验枚举，控制写入并行度，并做周期 Compaction。',origin:'牛客大数据面经与 Hive 工程实践'},
      {c:'hive',t:'统计信息与 CBO',tag:'高频优化',s:'CBO 依赖行数、大小、NDV 等统计估算成本，决定 Join 顺序和物理策略。',q:'为什么 Hive/Spark SQL 的统计信息很重要？',key:'基数估算 → Join 顺序 → 执行计划',a:'优化器需要估算每个算子输出规模，才能选择广播、Join 顺序和并行策略。统计缺失或过期会导致错误估算和低效计划。应维护表与列统计，结合 EXPLAIN 检查估算值，并用运行时指标验证，而不是盲目信任 CBO。',origin:'官方优化文档与牛客高频题'},

      {c:'spark',t:'Spark 为什么比 MapReduce 快',tag:'五星高频',s:'DAG 能流水线合并窄依赖，中间结果可在内存复用，并减少不必要落盘。',q:'Spark 为什么通常比 MapReduce 快？',key:'DAG + 内存复用 + 更少落盘',a:'MapReduce 每个阶段模型固定且中间结果常落盘；Spark 用 DAG 表达多步计算，把窄依赖流水线化，并允许缓存复用数据，适合迭代和交互计算。但 Spark 仍会在 Shuffle 落盘，也可能因内存、倾斜或 GC 变慢，不能回答成“完全在内存中计算”。',src:'https://www.nowcoder.com/discuss/353158958661705728'},
      {c:'spark',t:'Spark Shuffle 过程',tag:'五星高频',s:'Map 端按分区写 Shuffle 文件，Reduce 端拉取对应块并进行聚合、排序或 Join。',q:'Spark Shuffle 的写和读过程是什么？',key:'分区写文件 → 拉取 Block → 聚合排序',a:'ShuffleMapTask 根据目标分区对记录分桶，进行序列化、聚合或排序并写本地 Shuffle 文件，同时向 Driver 报告位置；下游 Task 从多个 Executor 拉取自己需要的 Block，边拉边合并，再进行聚合或排序。重点关注文件数量、网络、磁盘、序列化和倾斜。',src:'https://www.nowcoder.com/discuss/353158028356689920'},
      {c:'spark',t:'Spark 内存区域与溢写',tag:'四星原理',s:'执行内存服务 Shuffle/Join/聚合，存储内存服务 Cache；不足时可能淘汰或 Spill。',q:'Spark 内存不足时会发生什么？如何区分 Executor OOM 与 Driver OOM？',key:'执行/存储内存 + Spill + 角色定位',a:'执行内存不足时排序、聚合可 Spill 到磁盘；缓存可能被淘汰后重算。Executor OOM 常与单分区、广播、状态和序列化有关；Driver OOM 常见于 collect、toPandas、过多任务元数据或结果返回。先从失败角色和 Spark UI 定位，再调整数据分区与算法。',origin:'牛客面经与 Spark 官方调优文档'},

      {c:'flink',t:'Checkpoint 与 Savepoint',tag:'五星高频',s:'Checkpoint 面向自动故障恢复，Savepoint 面向人工触发的升级、迁移和运维。',q:'Flink Checkpoint 和 Savepoint 有什么区别？',key:'自动恢复 / 可控迁移',a:'Checkpoint 由系统周期触发并按保留策略清理，目标是故障后自动恢复；Savepoint 通常由用户触发、长期保存，用于版本升级、改并行度和迁移。二者都保存状态，但生命周期、运维语义和兼容性要求不同。',origin:'Flink 官方文档与牛客高频题'},
      {c:'flink',t:'Barrier 对齐与非对齐 Checkpoint',tag:'四星原理',s:'对齐快照会暂停已到 Barrier 的输入；非对齐把在途数据纳入快照以降低反压下等待。',q:'Flink Checkpoint 为什么需要 Barrier 对齐？反压严重时怎么办？',key:'一致切面 / 在途数据',a:'多输入算子要确保快照对应同一个逻辑边界，因此收到某输入 Barrier 后会暂缓该输入，等待其他输入；反压严重时对齐时间可能很长。非对齐 Checkpoint 把部分在途数据一并快照，降低等待，但可能增加快照体积和恢复成本。',origin:'Flink 官方文档与底层面经'},
      {c:'flink',t:'KeyBy、KeyGroup 与扩缩容',tag:'四星原理',s:'KeyBy 决定同 Key 到同并行实例；KeyGroup 是状态重新分配的最小单位。',q:'Flink 有状态任务修改并行度后，状态如何重新分配？',key:'Key → KeyGroup → Subtask',a:'KeyBy 对 Key 哈希后映射到 KeyGroup，KeyGroup 再按并行度分配给 Subtask。恢复或扩缩容时，Flink 重新分配 KeyGroup 及其状态；最大并行度限制可分配的 KeyGroup 数，因此上线前应合理规划。',origin:'Flink 官方文档与工程实践'},

      {c:'kafka',t:'LEO、HW 与 ISR',tag:'五星高频',s:'LEO 是日志末端位置，HW 是已提交边界，ISR 是与 Leader 保持同步的副本集合。',q:'Kafka 的 ISR、HW、LEO 分别是什么？',key:'同步副本 / 已提交边界 / 日志末端',a:'每个副本的 LEO 指向其下一条写入位置；Leader 根据 ISR 副本同步进度推进 HW，消费者通常只能读到 HW 之前的数据；ISR 维护与 Leader 足够同步的副本。它们共同影响副本切换时的数据可见性与可靠性。',origin:'Kafka 官方文档与牛客高频题'},
      {c:'kafka',t:'幂等生产者与事务',tag:'五星高频',s:'幂等生产者避免同一分区重试重复；事务把多分区写入和 Offset 提交纳入原子边界。',q:'Kafka 如何实现幂等和 Exactly-once？',key:'PID/序列号 + 事务 + read_committed',a:'幂等生产者通过 ProducerId 和分区序列号识别重试重复，范围是单生产者会话内的分区写入；事务生产者可原子提交多分区消息，并可连同消费 Offset 一起提交。消费者需使用 read_committed，且外部 Sink 仍要有自己的事务或幂等保证。',src:'https://www.nowcoder.com/discuss/475594795038134272'},
      {c:'kafka',t:'分区有序与 Rebalance',tag:'五星场景',s:'稳定 Key 保证业务消息进入同一分区；Rebalance 期间要控制停顿和重复处理。',q:'Kafka 如何保证订单消息有序？Rebalance 会带来什么问题？',key:'同 Key 同分区 + 正确提交 Offset',a:'Kafka 只保证分区内有序，应以订单号等稳定 Key 分区，并避免重试配置破坏顺序。消费者组成员变化会重新分配分区，期间可能暂停消费；若 Offset 与业务处理边界不一致，还会重复或丢失。可采用合作式重平衡、静态成员和幂等消费降低影响。',src:'https://www.nowcoder.com/discuss/457496886002352128'},

      {c:'lakehouse',t:'数据湖、数仓与湖仓',tag:'五星热点',s:'数据湖强调低成本保存多形态原始数据，数仓强调治理与分析，湖仓尝试统一开放存储与表管理。',q:'数据湖、数据仓库和湖仓一体有什么区别？',key:'开放存储 / 治理分析 / 统一表能力',a:'数据湖可在对象存储或 HDFS 保存结构化、半结构化和非结构化数据，但容易出现治理和性能问题；传统数仓提供稳定 Schema、事务和高性能分析；湖仓在开放文件之上增加表格式、事务、版本、Schema 演进和优化能力，让多个引擎共享可信数据。',src:'https://www.nowcoder.com/discuss/500412002142003200'},
      {c:'lakehouse',t:'Iceberg、Hudi、Delta Lake',tag:'五星热点',s:'三者都是湖仓表格式，差异集中在写入模型、索引/元数据、流批能力和生态集成。',q:'Iceberg、Hudi、Delta Lake 应该如何选型？',key:'更新模式 + 查询引擎 + 运维生态',a:'Iceberg 以快照和 Manifest 组织大规模分析表，跨引擎生态广；Hudi 强调增量处理、Upsert 和 MOR/COW；Delta Lake 与 Spark 生态结合紧密并提供事务日志。选型应基于更新频率、增量消费、引擎兼容、Compaction 和团队运维实测。',src:'https://www.nowcoder.com/feed/main/detail/61f8d0a985a1438bb1a3b2baf1302b51'},
      {c:'lakehouse',t:'湖仓 ACID 与 Snapshot',tag:'四星原理',s:'通过原子提交元数据指针，让读者看到完整快照，而不是直接原地修改大量数据文件。',q:'对象存储上的湖仓表如何实现 ACID 和时间旅行？',key:'不可变文件 + 原子元数据提交 + 快照链',a:'写入通常生成新的数据文件和元数据，提交时原子更新表的当前快照指针；读者固定读取某个快照，因此看不到半完成写入。历史快照保留文件引用，可用于时间旅行和回滚；并发冲突通过乐观并发控制或提交校验处理。',origin:'Iceberg/Hudi/Delta 官方概念与面经'},
      {c:'lakehouse',t:'Compaction 与小文件',tag:'四星工程',s:'流式和频繁 Upsert 易产生小文件或增量日志，需要异步合并平衡写延迟和读放大。',q:'湖仓为什么仍然需要 Compaction？',key:'写放大 / 读放大 / 延迟取舍',a:'为了低延迟写入，系统往往先写小文件或增量日志；查询时文件过多、合并成本和元数据压力都会上升。Compaction 把小文件或增量记录重写为较大基础文件，但会占用 IO 和计算资源，因此需设置目标文件大小、触发策略并避免与高峰查询冲突。',origin:'湖仓工程实践与牛客热点题'},
      {c:'lakehouse',t:'HBase 架构与数据模型',tag:'四星高频',s:'HBase 在 HDFS 上提供按 RowKey 排序的宽列存储，Region 是分片与服务单元。',q:'HBase 的核心架构和读写路径是什么？',key:'RowKey → Region → WAL/MemStore/HFile',a:'客户端根据元数据定位 RegionServer；写入先追加 WAL，再写 MemStore，刷盘形成 HFile，后台 Compaction 合并文件；读取结合 BlockCache、MemStore 和 HFile。HMaster 负责管理与均衡，ZooKeeper/协调服务帮助发现和故障处理。',src:'https://www.nowcoder.com/discuss/475594795038134272'},
      {c:'lakehouse',t:'HBase RowKey 与热点',tag:'四星高频',s:'RowKey 决定排序和 Region 分布；单调递增 Key 容易把写流量集中到一个 Region。',q:'HBase RowKey 如何设计，怎样避免热点？',key:'查询前缀 + 散列分布 + 长度控制',a:'RowKey 应服务主要查询模式并尽量短；时间戳或自增 ID 直接做前缀会集中写入，可增加 Hash/盐值前缀、反转固定长度 ID 或预分区打散。打散会增加范围查询成本，因此要在写入均衡与读取路径之间取舍。',src:'https://www.nowcoder.com/discuss/475594795038134272'},
      {c:'lakehouse',t:'OLAP 引擎选型',tag:'五星场景',s:'从明细/聚合、更新、Join、并发、延迟、成本和运维七个维度比较。',q:'ClickHouse、Doris/StarRocks、Hive/Spark SQL 如何选？',key:'数据模型 + 查询负载 + 更新与并发',a:'Hive/Spark SQL 适合大规模离线扫描和复杂 ETL；ClickHouse 擅长高吞吐写入与单表宽表聚合；Doris/StarRocks 更强调实时更新、多表 Join、物化视图和高并发服务。最终需要用真实数据验证导入、P95 延迟、并发、更新和资源成本。',src:'https://www.nowcoder.com/discuss/475594795038134272'},
      {c:'lakehouse',t:'物化视图与预聚合',tag:'四星优化',s:'提前保存常用查询结果，以存储与刷新成本换取查询延迟。',q:'物化视图为什么能加速查询？什么时候不适合？',key:'预计算 + 查询改写 + 刷新成本',a:'物化视图预先计算常用聚合或 Join，优化器可将匹配查询改写到更小结果上；适合模式稳定、高频复用的查询。不适合维度组合变化极多、更新极频繁或命中率低的场景，否则刷新、存储和一致性维护成本可能超过收益。',origin:'OLAP 官方文档与牛客场景题'}
    );

    const LESSONS={
      warehouse:[
        {title:'从业务问题到数仓模型',time:'12 分钟',goal:'理解建模不是先建表，而是先识别业务过程与粒度',intro:'数仓建设的起点不是技术组件，而是业务过程。先弄清“发生了什么事件、以什么粒度记录、从哪些角度分析”，表结构才会稳定。',points:[{h:'第一步：选择业务过程',p:'例如下单、支付、退款、发货、点击。过程应能被业务明确命名，并具有可追踪的事件边界。'},{h:'第二步：声明粒度',p:'一句话写清事实表每一行代表什么，例如“一行代表一个订单明细”。粒度混杂是重复计算和口径冲突的根源。'},{h:'第三步：确定维度',p:'时间、用户、商品、渠道、地区等回答“从什么角度观察”。优先复用一致性维度。'},{h:'第四步：确定事实',p:'金额、数量、时长等可加度量，以及订单状态等退化维度。最后检查事实是否与声明粒度一致。'}],note:'面试表达：业务过程 → 粒度 → 维度 → 事实，是维度建模最稳妥的四步法。'},
        {title:'分层架构与数据流转',time:'15 分钟',goal:'掌握每层职责、依赖规范和为什么不能随意跨层',intro:'分层的本质是把复杂 ETL 拆成职责单一、可复用、可追溯的加工步骤。层数不是越多越好，关键是每层边界清楚。',points:[{h:'ODS：保存原貌',p:'贴近源系统，补充采集时间、来源和分区。尽量不做业务口径转换，为重放和审计保留依据。'},{h:'DWD：形成可信明细',p:'清洗脏数据、统一编码和时间口径，围绕业务过程建设事实表，与 ODS 保持可追溯关系。'},{h:'DWS：沉淀公共汇总',p:'按主题和常用统计周期汇总，复用跨报表指标，避免每个 ADS 重复扫描明细。'},{h:'ADS：服务具体应用',p:'面向报表、接口、推荐或风控交付。变化快，但核心指标应来自公共层而非重新定义。'}],note:'跨层引用的问题：ADS 直接反复读取 ODS，会绕过清洗与统一口径，导致重复逻辑、难治理和高扫描成本。'},
        {title:'事实表、维度表与历史变化',time:'14 分钟',goal:'把事实类型、维度变化与拉链表串起来',intro:'事实表记录事件，维度表描述事件。真正的难点是时间：订单状态会变、用户等级会变，分析必须回答“现在是什么”和“当时是什么”。',points:[{h:'事务事实表',p:'每次业务事件一行，粒度最细，如支付流水。适合累加和明细追溯。'},{h:'周期快照事实表',p:'按日/月记录状态快照，如每日库存。适合余额、存量等半可加指标。'},{h:'累积快照事实表',p:'一行跟踪一个流程的多个里程碑，如下单、支付、发货、签收时间。'},{h:'缓慢变化维',p:'Type 1 覆盖旧值；Type 2 新增版本并保留有效期；Type 3 用额外列保存有限历史。拉链表通常实现 Type 2。'}]}
      ],
      hadoop:[
        {title:'Hadoop 到底是什么',time:'15 分钟',goal:'建立 HDFS、YARN、MapReduce 的分层心智模型',intro:'Hadoop 不是一个单独的数据库或计算程序，而是一组运行在普通服务器集群上的分布式基础设施。理解它要先把存储、资源和计算三个职责拆开。',points:[{h:'HDFS：分布式存储',p:'把大文件切成 Block 分散到 DataNode，通过副本和故障恢复提供高吞吐可靠存储。'},{h:'YARN：资源操作系统',p:'统一管理 CPU、内存和 Container，让 MapReduce、Spark 等不同计算框架共享集群。'},{h:'MapReduce：批处理模型',p:'将计算拆为 Map 与 Reduce，框架负责切片、调度、Shuffle 和失败重试。'},{h:'生态层',p:'Hive 提供 SQL，HBase 提供按 RowKey 的低延迟访问，ZooKeeper 提供协调；组件组合成完整数据平台。'}],note:'面试第一句：Hadoop 的核心不是“存很多数据”，而是把分布式存储、资源管理和批计算标准化。',refs:[['Apache Hadoop YARN','https://hadoop.apache.org/docs/current/hadoop-yarn/hadoop-yarn-site/YARN'],['牛客 Hadoop 高频题','https://www.nowcoder.com/discuss/353159520220291072']]},
        {title:'MapReduce 从输入到输出',time:'20 分钟',goal:'能口述 Map、Shuffle、Reduce 全流程并指出瓶颈',intro:'MapReduce 的价值是让开发者主要关注 map 和 reduce 函数，框架处理数据切片、数据移动、排序和容错。真正的高频追问集中在 Shuffle。',points:[{h:'输入切片',p:'InputFormat 产生逻辑 InputSplit，RecordReader 把字节转成键值记录。Split 数影响 Map 并行度，但不等于 HDFS Block。'},{h:'Map 端',p:'Map 输出进入缓冲区，按目标 Reduce 分区，溢写时排序并落盘，多次 Spill 最终合并。'},{h:'Shuffle',p:'Reduce 主动从各 Map 节点拉取自己的分区，归并排序并把相同 Key 的值组织在一起。'},{h:'Reduce 与输出',p:'reduce() 处理分组记录，再由 OutputFormat 写出。失败 Task 可重试，慢 Task 可在合适场景启用推测执行。'}],note:'优化主线：减少 Map 输出 → 减少 Shuffle 字节 → 避免热点分区 → 合理设置 Reduce 数。',refs:[['Apache MapReduce Tutorial','https://hadoop.apache.org/docs/r3.3.6/hadoop-mapreduce-client/hadoop-mapreduce-client-core/MapReduceTutorial.html'],['京东大数据面经','https://www.nowcoder.com/discuss/475594795038134272']]},
        {title:'YARN 如何把资源交给任务',time:'16 分钟',goal:'串起 ResourceManager、NodeManager、ApplicationMaster 和 Container',intro:'YARN 把全局资源管理从具体计算框架中拆出来。一次应用提交后，会有自己的 ApplicationMaster 协调资源和任务，这也是 Hadoop 2.x 之后能承载多种计算框架的关键。',points:[{h:'ResourceManager',p:'全局资源仲裁与应用入口；Scheduler 根据队列、容量和优先级分配资源。'},{h:'NodeManager',p:'每台机器的代理，启动和监控 Container，向 RM 汇报节点资源。'},{h:'ApplicationMaster',p:'每个应用一个，申请 Container、协调 Task、处理失败并汇报进度。'},{h:'Container',p:'任务运行的资源边界，包含 CPU、内存等配额；不是虚拟机，也不一定是 Docker 容器。'}],note:'排障时把问题分为：应用逻辑慢、AM 调度慢、队列拿不到资源、节点资源或 Container 失败。',refs:[['Apache Hadoop YARN','https://hadoop.apache.org/docs/current/hadoop-yarn/hadoop-yarn-site/YARN'],['牛客 YARN 面试题','https://www.nowcoder.com/discuss/353159630853447680']]}
      ],
      hdfs:[
        {title:'HDFS 为什么这样设计',time:'12 分钟',goal:'从硬件不可靠推导出 Block、副本与主从架构',intro:'HDFS 假设普通机器会经常故障，因此不追求单机永不出错，而是通过切块、分布、副本和自动恢复，让整体系统可靠。它更擅长大文件顺序读写，不擅长低延迟随机修改。',points:[{h:'Block',p:'大文件被切成固定大小的数据块，块可分布到多台 DataNode，并行存储和计算。'},{h:'NameNode',p:'维护目录树、权限、文件到块的映射与副本位置；不承载真实文件数据流。'},{h:'DataNode',p:'保存实际数据块，定期心跳和块报告。心跳丢失后 NameNode 会安排补副本。'},{h:'客户端',p:'先询问 NameNode 元数据，再直接与 DataNode 读写，因此元数据节点不成为数据传输瓶颈。'}]},
        {title:'读写流程与机架感知',time:'16 分钟',goal:'能够画出 Pipeline 写入与就近读取',intro:'理解 HDFS 流程要抓住两个关键词：写入用 Pipeline 串行复制并反向 ACK，读取按网络距离选择最近副本并自动容错。',points:[{h:'写入路径',p:'申请文件 → NameNode 选择副本节点 → 客户端切 Packet → 沿 Pipeline 发送 → 反向 ACK → 完成 Block。'},{h:'读取路径',p:'获取 BlockLocation → 选择最近 DataNode → 校验和读取 → 节点失败时切换其他副本并报告坏块。'},{h:'机架感知',p:'副本跨节点、跨机架分布，既避免一个机架故障导致数据丢失，又控制跨机架写带宽。'},{h:'一致性边界',p:'HDFS 适合一次写入、多次读取。追加可用，但不适合像数据库那样频繁随机更新。'}]},
        {title:'容量、可靠性与小文件治理',time:'13 分钟',goal:'知道副本、纠删码和文件合并分别解决什么问题',intro:'热数据常用副本换取快速恢复；冷数据可用纠删码降低冗余。小文件则是另一个问题：它同时消耗 NameNode 内存和计算调度资源。',points:[{h:'三副本',p:'恢复简单、读性能好，但 1 份数据约占 3 份空间，适合访问频繁的数据。'},{h:'纠删码 EC',p:'例如 6+3：6 个数据块加 3 个校验块，约 1.5 倍空间，可容忍一定块丢失，但编码恢复成本更高。'},{h:'小文件来源',p:'上游微批、过多动态分区、过高并行度、Map-only 输出都可能造成大量小文件。'},{h:'治理方法',p:'采集端合批、CombineInputFormat、合理分区数、周期 Compaction，并从监控中观察文件数与平均大小。'}]},
        {title:'NameNode 元数据、启动与 HA',time:'18 分钟',goal:'理解 FsImage/EditLog、SafeMode、主备切换和脑裂防护',intro:'NameNode 的难点不是文件正文，而是海量命名空间元数据以及故障时如何恢复一致状态。要把“Checkpoint”和“HA”严格区分。',points:[{h:'持久化',p:'FsImage 是命名空间快照，EditLog 是之后的增量操作；Checkpoint 合并二者，SecondaryNameNode 不是热备。'},{h:'启动安全模式',p:'加载镜像和日志后等待 DataNode 上报块，满足安全块比例才开放写操作。'},{h:'HA 日志同步',p:'Active 向 JournalNode 仲裁组写 EditLog，Standby 持续追日志并维护热状态。'},{h:'自动切换与 Fencing',p:'ZKFC 监控健康、借助 ZooKeeper 选主；切换时隔离旧 Active，防止脑裂写入。'}],refs:[['HDFS Architecture Guide','https://hadoop.apache.org/docs/stable1/hdfs_design.pdf'],['携程底层框架面经','https://www.nowcoder.com/discuss/457496886002352128']]}
      ],
      hive:[
        {title:'Hive SQL 从文本到任务',time:'14 分钟',goal:'理解执行流程和优化发生在哪一层',intro:'Hive 不是“存数据的数据库”，而是把 SQL 转成分布式执行计划的计算入口。查询性能首先由扫描数据量与 Shuffle 决定。',points:[{h:'编译链路',p:'解析 SQL → 语义检查 → 逻辑计划 → 规则/代价优化 → 物理计划 → 提交执行引擎。'},{h:'最先减少扫描',p:'使用分区裁剪、列裁剪、谓词下推；避免 select * 和对分区列套函数导致裁剪失效。'},{h:'再减少 Shuffle',p:'小表广播、预聚合、合理 Join 顺序、避免无意义 distinct，并让数据在早期尽量变小。'},{h:'最后看物理布局',p:'ORC/Parquet、压缩、文件大小、统计信息、Bloom Filter 与排序布局决定 IO 效率。'}],code:'-- 排查慢 SQL 的顺序\nEXPLAIN SELECT ...;\n-- 1. 看扫描分区和列\n-- 2. 看 Join / Exchange / Shuffle\n-- 3. 看长尾 Task 与文件布局'},
        {title:'窗口函数的统一心智模型',time:'18 分钟',goal:'用“分区、排序、窗口边界”理解排名、累计、前后取值',intro:'窗口函数不会像 group by 那样天然减少行数。可以把它理解为：先把数据分组排队，再给每一行划一个可见范围，最后在这个范围内计算。',points:[{h:'PARTITION BY',p:'决定互不影响的分组，例如每个用户。省略时整张结果集是一个分区。'},{h:'ORDER BY',p:'决定组内先后顺序，也是 lag/lead、排名和累计计算成立的基础。'},{h:'ROWS 与 RANGE',p:'ROWS 按物理行数；RANGE 按排序值的逻辑范围。相同排序值在 RANGE 中通常作为一组。'},{h:'常见函数族',p:'排名 row_number/rank；偏移 lag/lead；聚合 sum/max；取值 first_value/last_value。'}],code:'sum(amount) over (\n  partition by user_id\n  order by dt\n  rows between 6 preceding and current row\n) as rolling_7_rows'},
        {title:'HiveSQL 高频题的通用套路',time:'22 分钟',goal:'掌握连续区间、留存、日期补齐与行列转换',intro:'复杂 SQL 题很少需要“灵光一现”。大多数可以归入四类模板：排序后分组、基准日自连接、生成日期骨架、集合的展开与收集。',points:[{h:'连续登录',p:'严格连续可用 date_sub(login_date,row_number) 得到稳定分组键；允许间隔时用 lag 算差值、打断点标签，再累计标签分组。'},{h:'留存',p:'用户-日期先去重，再把基准日与未来登录日按 uid 连接，使用 datediff 统计第 N 日是否回访。'},{h:'日期补齐',p:'先生成完整日期骨架，再 left join 原始数据；缺失值可用累计窗口、前后非空值或业务默认值处理。'},{h:'行列转换',p:'字符串/数组展开用 lateral view + explode/posexplode；多行收集用 collect_list/set + concat_ws。'}],code:'-- 严格连续登录：日期减去序号后，同一连续段得到相同 grp\nwith x as (\n  select uid, login_date,\n         date_sub(login_date, row_number() over(partition by uid order by login_date)) grp\n  from (select distinct uid, login_date from login_log) t\n)\nselect uid, min(login_date), max(login_date), count(*) days\nfrom x group by uid, grp having count(*) >= 3;',note:'先口头说出模板，再写 SQL：去重 → 排序 → 构造分组键 → 聚合过滤。这样更容易让面试官跟上你的思路。'}
      ],
      spark:[
        {title:'Spark 执行体系：从 Action 到 Task',time:'15 分钟',goal:'串起 Driver、DAG、Stage、Task 和 Executor',intro:'Action 触发 Job；DAG Scheduler 按宽依赖切 Stage；Task Scheduler 把每个 Stage 的分区任务发送到 Executor。性能问题最终都能落到数据量、分区、Shuffle 或资源。',points:[{h:'Transformation',p:'延迟计算，只记录血缘。窄依赖可流水线执行，宽依赖意味着跨分区重分布。'},{h:'Stage',p:'以 Shuffle 为边界切分。一个 Stage 内的窄依赖可合并成流水线。'},{h:'Task',p:'Stage 按分区产生 Task。分区过少并行不足，过多则调度和小文件开销上升。'},{h:'容错',p:'丢失分区可根据 RDD 血缘重算；Checkpoint 用于截断过长血缘并保存可靠状态。'}]},
        {title:'Shuffle、倾斜与分区设计',time:'17 分钟',goal:'学会从 Spark UI 的长尾现象反推热点 Key',intro:'Shuffle 是把同一 Key 的数据搬到同一分区，网络、磁盘和序列化成本高。倾斜则让少数分区远大于其他分区，表现为少数 Task 极慢或 OOM。',points:[{h:'先确认现象',p:'比较 Task 时长、Shuffle Read、输入记录数和 GC，确认是否只有少数长尾。'},{h:'再找热点 Key',p:'抽样或聚合统计 Key 分布，检查 null、默认值、热门商品等是否集中。'},{h:'按原因处理',p:'热点加盐两阶段聚合、拆分热点、广播小表、提高并行度或启用 AQE skew join。'},{h:'避免伪优化',p:'单纯增加 Executor 内存可能只延迟 OOM；必须先改变热点数据的分布。'}]}
      ],
      flink:[
        {title:'无界流中的时间与窗口',time:'16 分钟',goal:'理解事件时间、Watermark 与迟到数据的关系',intro:'流数据没有天然的“全部到齐”。Flink 用 Watermark 表达事件时间进度的估计，让系统能在乱序条件下决定何时触发窗口。',points:[{h:'事件时间',p:'来自业务事件本身，网络重试后仍不变，适合可重现统计。'},{h:'处理时间',p:'记录到达算子的机器时间，简单低延迟，但结果受拥堵和恢复影响。'},{h:'Watermark',p:'不是一条数据的时间戳，而是系统对整体事件时间进度的判断。'},{h:'迟到处理',p:'允许一定 lateness 更新窗口；更晚的数据写侧输出，再通过补算或修正链路处理。'}]},
        {title:'状态、Checkpoint 与端到端一致性',time:'18 分钟',goal:'分清内部状态一致与端到端 Exactly-once',intro:'Checkpoint 保存的是算子状态的一致性快照。要做到端到端精确一次，还需要 Source 能从确定位点重放、Sink 支持事务或可靠幂等。',points:[{h:'状态分区',p:'Keyed State 随 Key 分布到并行实例，扩缩容时可重新分配；应配置 TTL 控制增长。'},{h:'Barrier',p:'随数据流传播并界定快照边界，多输入算子需要对齐或使用非对齐 Checkpoint。'},{h:'恢复',p:'失败后恢复算子状态与 Source 位点，再重放未完成数据。'},{h:'Sink',p:'两阶段提交、事务提交或业务主键幂等，是端到端语义最后一环。'}]}
      ],
      kafka:[
        {title:'分布式提交日志模型',time:'13 分钟',goal:'从 Partition 理解吞吐、有序和扩展边界',intro:'Kafka 的核心不是“消息队列接口”，而是按 Partition 追加写的分布式日志。Partition 同时是并行度、顺序和存储分布的基本单位。',points:[{h:'顺序性',p:'只保证单 Partition 内有序。同序业务必须使用稳定 Key 路由到同一分区。'},{h:'并行度',p:'同一消费者组里一个分区同时只能给一个消费者，消费者多于分区会空闲。'},{h:'副本',p:'Leader 处理读写，Follower 同步；ISR 和最小同步副本决定故障时可靠性。'},{h:'Offset',p:'消费者位置由组管理。处理成功再提交，并让下游写入幂等，才能降低重复与丢失风险。'}]},
        {title:'可靠性与积压排查',time:'15 分钟',goal:'把生产端、Broker、消费端串成一条端到端链路',intro:'Kafka 不丢消息不是一个参数能保证的。生产重试、Broker 副本和消费提交必须一起设计；积压则要比较生产速率与消费速率。',points:[{h:'生产端',p:'使用合适 acks、重试、幂等生产者，并关注超时后重复发送。'},{h:'Broker',p:'足够副本、min.insync.replicas、磁盘水位和故障副本监控。'},{h:'消费端',p:'业务处理成功后提交 Offset；批量消费要明确失败重试与部分成功策略。'},{h:'积压处理',p:'看 Lag 是否均匀，定位 CPU、GC、网络或 Sink；扩消费者前先确认分区数量。'}]}
      ],
      database:[
        {title:'从磁盘 IO 理解 B+ 树索引',time:'15 分钟',goal:'理解树高、聚簇索引、回表与覆盖索引',intro:'数据库索引首先解决的是“少读页”。B+ 树高扇出、叶子有序，既适合点查也适合范围扫描。优化索引要围绕过滤、排序和返回列设计。',points:[{h:'高扇出低树高',p:'非叶子节点只放键与指针，一个页可容纳更多分支，通常少量 IO 就能定位叶子。'},{h:'聚簇索引',p:'InnoDB 主键叶子保存整行；二级索引叶子保存主键，因此返回非索引列时可能回表。'},{h:'联合索引',p:'按列顺序排序，遵循最左前缀；范围条件后续列用于定位的能力通常受限。'},{h:'覆盖索引',p:'查询所需列都在索引中，可避免回表，但索引也会增加写入与空间成本。'}]},
        {title:'事务、锁与 MVCC',time:'17 分钟',goal:'能解释隔离级别背后的并发取舍',intro:'事务隔离不是越强越好。数据库用锁保护当前读和写，用 MVCC 让许多快照读不阻塞写，在一致性与吞吐之间折中。',points:[{h:'版本链',p:'记录保存事务版本信息，Read View 决定当前事务能看到哪个历史版本。'},{h:'快照读',p:'普通 select 常按一致性视图读取，不必锁住正在更新的行。'},{h:'当前读',p:'select for update、update、delete 读取最新版本并加锁。'},{h:'幻读处理',p:'InnoDB 可重复读下，当前读结合记录锁与间隙锁控制范围内新插入。'}]}
      ],
      lakehouse:[
        {title:'从数据湖到湖仓一体',time:'16 分钟',goal:'理解开放文件存储为什么还需要表格式',intro:'只把文件放进 HDFS 或对象存储，并不会自动得到一个好用的数据湖。缺少事务、Schema、版本和治理时，数据很容易变成难以信任的数据沼泽。湖仓表格式解决的正是文件之上的表管理问题。',points:[{h:'数据湖',p:'低成本保存多形态原始数据，开放给多个引擎，但治理和查询性能需要额外建设。'},{h:'传统数仓',p:'Schema、事务和查询性能成熟，但开放性、成本与多模态数据支持可能受限。'},{h:'湖仓表格式',p:'通过快照、元数据和原子提交，在开放文件上提供 ACID、时间旅行、Schema/Partition 演进。'},{h:'统一不等于一个引擎',p:'湖仓更像共享数据与元数据层，Spark、Flink、Trino 等引擎仍承担不同计算负载。'}],refs:[['牛客数据湖面试模块','https://www.nowcoder.com/discuss/500412002142003200']]},
        {title:'Iceberg、Hudi、Delta 的共同点与差异',time:'18 分钟',goal:'按更新模式和生态约束进行选型',intro:'不要背“谁最好”。先判断数据是追加为主还是频繁 Upsert、是否需要增量消费、主力查询引擎是什么，再比较表格式。',points:[{h:'共同能力',p:'管理文件集合、原子提交快照、并发控制、Schema 演进、时间旅行，并通过元数据减少目录扫描。'},{h:'Iceberg',p:'快照与 Manifest 设计清晰，跨引擎支持广，适合大型分析表和隐藏分区演进。'},{h:'Hudi',p:'强调记录级 Upsert、增量拉取和 COW/MOR 两种写读权衡，适合 CDC 与近实时链路。'},{h:'Delta Lake',p:'事务日志模型与 Spark 生态结合紧密；选型还要考察现有平台、社区和云厂商支持。'}],note:'面试中最好补充：需要用真实数据测试写放大、读放大、Compaction、元数据规模和故障恢复。'},
        {title:'HBase 与 OLAP 服务层',time:'17 分钟',goal:'分清明细低延迟访问与分析聚合两类负载',intro:'HBase、ClickHouse、Doris/StarRocks 都能存很多数据，但查询模型完全不同。选型第一问不是“哪个快”，而是业务是按 RowKey 点查，还是大范围聚合和多维分析。',points:[{h:'HBase',p:'按 RowKey 有序的宽列存储，适合高吞吐写入和低延迟点查/范围扫描；RowKey 设计决定访问路径和热点。'},{h:'ClickHouse',p:'列式向量化，擅长宽表和高吞吐聚合；更新、多表服务需结合版本与模型评估。'},{h:'Doris/StarRocks',p:'强调实时导入、更新模型、物化视图、多表 Join 和较高并发分析服务。'},{h:'离线引擎',p:'Hive/Spark SQL 适合复杂 ETL 与大规模批处理，不应直接承担大量毫秒级在线请求。'}],refs:[['京东大数据面经','https://www.nowcoder.com/discuss/475594795038134272']]}
      ],
      computer:[
        {title:'网络请求的完整链路',time:'14 分钟',goal:'把 DNS、TCP、TLS、HTTP 与负载均衡串起来',intro:'“输入 URL 后发生什么”是一道知识地图题。回答时按时间顺序展开，并在每一层指出缓存、握手和故障点。',points:[{h:'DNS',p:'浏览器/系统缓存 → 本地 DNS → 递归/权威查询，获得 IP；CDN 可能返回就近节点。'},{h:'传输层',p:'TCP 三次握手确认双方收发能力与初始序号；QUIC 则基于 UDP 集成加密和多路复用。'},{h:'TLS/HTTP',p:'HTTPS 协商加密与证书校验，再发送 HTTP 请求；连接复用减少重复握手。'},{h:'服务端',p:'请求经过网关、负载均衡、应用和缓存/数据库，响应返回后浏览器解析与渲染。'}]},
        {title:'Linux 四维排障法',time:'12 分钟',goal:'遇到服务器变慢时从资源现象走到具体进程',intro:'不要罗列命令。先确定 CPU、内存、磁盘、网络哪个维度异常，再定位进程、线程和调用，最后与日志时间线互相印证。',points:[{h:'CPU',p:'top/pidstat 看使用率、负载和运行队列；区分用户态、系统态与 IO wait。'},{h:'内存',p:'free/vmstat 看可用内存和 swap；关注是否频繁换页以及进程 RSS 增长。'},{h:'磁盘',p:'iostat 看利用率、等待和队列；df/du 检查容量与 inode。'},{h:'网络',p:'ss 看连接状态，sar/iftop 看吞吐和丢包，再结合应用超时与重试日志。'}]}
      ],
      governance:[
        {title:'数据治理的完整闭环',time:'16 分钟',goal:'从规范、元数据、质量、安全、成本和运营理解治理',intro:'治理不是“补几条质量规则”，而是让数据可理解、可信、可追溯、安全且成本可控。它需要制度、平台能力和持续运营共同落地。',points:[{h:'标准与模型',p:'统一命名、数据类型、主键、维度编码和指标口径，减少同名不同义。'},{h:'元数据与血缘',p:'采集表、字段、任务、负责人和上下游关系，支持搜索、影响分析和故障定位。'},{h:'质量与安全',p:'完整性、唯一性、准确性、一致性、及时性；同时实施分级分类、权限、脱敏与审计。'},{h:'成本与运营',p:'看存储、扫描、调度和资产使用率；治理项要有负责人、收益指标、观察期和回收机制。'}]},
        {title:'ODS 全量转增量与冷归档案例',time:'20 分钟',goal:'理解如何把源库压力、可恢复性和存储成本一起优化',intro:'附件案例的核心不是“把全量改成增量”这么简单，而是保留三个角色：增量表承接变化、近期全量快照支持快速重放、冷归档保存低频历史。',points:[{h:'适用前提',p:'源表最好有稳定主键和最后更新时间；若存在物理删除，还需要 Binlog 删除事件、周期对账或快照差分补足。'},{h:'每日流程',p:'按更新时间抽增量 → 与昨日全量按主键 Merge → 生成今日全量分区 → 校验行数/Hash。'},{h:'分层存储',p:'近期热分区保留在 HDFS；历史增量长期保存；几乎不访问的全量快照进入冷归档。'},{h:'风险控制',p:'处理迟到更新、重复抽取、删除感知、位点丢失和补数；Merge 必须幂等。'}],code:'-- 今日全量 = 今日增量 + 昨日未发生变更的数据\nselect * from ods_table_incr where d = today\nunion all\nselect old.* from ods_table old\nleft anti join ods_table_incr inc\n  on old.id = inc.id and inc.d = today\nwhere old.d = yesterday;',note:'冷归档只适合极低频访问数据：取回可能需要解冻，并伴随最低存储周期与读取费用。'},
        {title:'从真实调度看成本优化',time:'18 分钟',goal:'掌握“少扫、少算、复用、优化布局”的递进方法',intro:'附件中的高成本任务每天扫描近 30 天埋点并多次 Join。优化路径非常典型：先减少重复扫描，再把全量计算改为增量，最后优化文件布局和过滤。',points:[{h:'一次扫描多指标',p:'把多段 actioncode 子查询合为一次扫描，用 count distinct case when 分别计算指标。'},{h:'全量改增量',p:'只计算昨日数据，与前一日已产出的历史结果 union all，避免每天重扫 30 天。'},{h:'固化复用逻辑',p:'多次复用且成本高的子查询落成公共中间表，减少重复排序和 Join。'},{h:'文件布局优化',p:'等值过滤多的 ORC 列可用 Bloom Filter；多列联合过滤可评估 Z-Order；ZSTD 提高压缩率。'}],note:'优化顺序建议：先改数据处理逻辑，再调资源参数。逻辑层面的“少扫描一次”通常比单纯加内存收益更稳定。'}
      ]
    };

    const state={cat:'home',query:'',onlyStar:false,bankCat:'all',bankMode:'all',bankQuery:'',stars:new Set(JSON.parse(localStorage.getItem('dw-stars')||'[]')),studied:new Set(JSON.parse(localStorage.getItem('dw-studied')||'[]'))};
    const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    function save(){localStorage.setItem('dw-stars',JSON.stringify([...state.stars]));localStorage.setItem('dw-studied',JSON.stringify([...state.studied]));updateProgress()}

    function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600)}
    function renderNav(){const counts=Object.fromEntries(CATEGORIES.map(c=>[c.id,ITEMS.filter(i=>i.c===c.id).length]));$('#nav').innerHTML=CATEGORIES.map(c=>`<button data-cat="${c.id}" class="${state.cat===c.id&&!state.onlyStar?'active':''}"><span class="ico">${c.icon}</span>${c.name}<em>${c.id==='home'||c.id==='bank'?ITEMS.length:counts[c.id]}</em></button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;state.query='';state.onlyStar=false;$('#search').value='';$('.sidebar').classList.remove('mobile-open');render()})}
    function cards(items){return `<div class="topic-grid">${items.map((i,n)=>{const idx=ITEMS.indexOf(i);return `<article class="topic-card ${state.studied.has(idx)?'study':''}" data-open="${idx}"><span class="num">${String(n+1).padStart(2,'0')}</span><h3>${esc(i.t)}</h3><p>${esc(i.s)}</p><footer><span>${esc(i.tag)}</span><b>${state.stars.has(idx)?'★ 已收藏':'查看问答 →'}</b></footer></article>`}).join('')}</div>`}
    const DEEP={
      'ODS / DWD / DWS / ADS 分层':['先按数据加工职责划分，而不是为了层数而分层：ODS 保真，DWD 统一业务事实，DWS 沉淀可复用汇总，ADS 面向具体应用。','公共口径应尽量收敛在 DWD/DWS；ADS 只做轻量组合，避免同一指标在多个应用层重复计算。','分层会增加存储与调度链路，因此小规模场景可以适当合层，但数据职责和口径边界仍要清楚。'],
      '缓慢变化维与拉链表':['拉链表主要解决维度属性变化后的历史回溯，不是所有字段变化都值得保留历史。','常见实现包含业务主键、生效时间、失效时间和当前版本标记；时间区间要统一采用左闭右开或其他明确规则。','每日装载应同时关闭旧版本并插入新版本，而且重跑必须幂等；删除数据通常还需要增加删除标记。'],
      'HDFS 写流程':['NameNode 只负责命名空间、权限和块位置等元数据，不传输文件正文。','客户端把数据组织成 Packet，通过 DataStreamer 写入副本管道；确认消息按相反方向逐级返回。','节点失败时管道会重建并继续写入；最终是否成功还要满足最小副本数等策略要求。'],
      '小文件问题':['危害分为存储端和计算端：NameNode 元数据压力、文件打开和寻址开销、任务数量与调度开销都会上升。','治理要优先从产生端入手，例如控制写入并行度、按时间合批；历史小文件再通过 Compaction 合并。','不能无限合并成超大文件，应结合 HDFS Block、查询分区和下游并行度选择目标文件大小。'],
      'SQL 性能优化':['先看执行计划和运行指标，判断耗时发生在扫描、Shuffle、排序、Join、倾斜还是落盘阶段。','优化顺序通常是少读数据、少传数据、选对 Join、处理倾斜，最后才是增加资源和调整参数。','每次只改变少量因素，用同一数据规模比较扫描量、Shuffle 量、长尾任务和总耗时，避免“凭感觉调参”。'],
      'Spark 数据倾斜':['先确认是否真的倾斜：重点看 Task 时长分布、Shuffle Read、Peak Memory 和 Spill，而不是只看作业慢。','聚合倾斜可用随机前缀做两阶段聚合；Join 倾斜可广播小表、拆出热点 Key 或使用 AQE 的倾斜分区优化。','提高分区数只能缓解普通分区过大；如果同一个热点 Key 仍进入一个分区，单纯增加并行度不能根治。'],
      'Checkpoint 与 Exactly-once':['Checkpoint 通过 Barrier 协调算子状态快照；失败恢复后，Source 从对应位置重新消费。','端到端 Exactly-once 需要 Source 可重放、状态一致恢复、Sink 支持事务或幂等，三者缺一不可。','Exactly-once 描述的是处理语义，不等于绝不重试；外部系统若不支持事务，通常依靠业务主键、版本号或去重表实现幂等。'],
      '消息可靠性':['生产端关注确认级别、重试、幂等和错误处理；Broker 关注副本数、同步副本与故障选主。','消费端应在业务处理成功后提交位点，并让下游写入具备幂等性，否则重试可能造成重复结果。','“不丢”和“不重”是两个问题：可靠重试通常降低丢失风险，但会提高重复概率，因此必须端到端设计。'],
      'B+ 树索引':['B+ 树的非叶子节点不保存完整行，一页能容纳更多键，因此树高通常较低。','叶子节点按键有序并通过链表相连，既支持等值定位，也适合范围扫描和排序。','索引是否有效还取决于选择性、回表成本、查询条件和统计信息；不是建立索引后一定更快。'],
      '数据质量体系':['先把质量规则绑定到明确的表、字段、指标、负责人和时效，避免只有平台没有治理责任。','规则应覆盖完整性、唯一性、准确性、一致性和及时性，并设置合理阈值、基线与分级告警。','闭环包括发现、阻断或降级、血缘定位、修复补数、下游验证和复盘，不能停在“发出告警”。'],
      '实时数仓架构':['采集层保证变更可追踪与可回放；消息层负责缓冲和解耦；计算层处理时间、状态与一致性；服务层满足低延迟查询。','设计时同时考虑乱序、迟到、重复、维表变化、状态膨胀、反压和故障恢复。','实时与离线口径应共享指标定义，并通过对账、回补或批流一体表格式控制最终一致性。']
    };
    function sentencePoints(i){const base=(i.a||'').split(/[；。]/).map(x=>x.trim()).filter(Boolean);const extra=DEEP[i.t]||[];return [...base.map(x=>x+'。'),...extra].filter((x,n,a)=>a.indexOf(x)===n)}
    function logicSteps(i){return i.key.split(/\s*(?:→|\+|\/)\s*/).map(x=>x.trim()).filter(Boolean)}
    function detailed(i){const points=sentencePoints(i),steps=logicSteps(i);return `<div class="detail-summary"><span class="answer-label">核心结论</span>${esc(i.s)}</div><div class="detail-block"><h4>分点展开</h4><ol class="detail-list">${points.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div><div class="detail-block"><h4>回答路径</h4><div class="logic-path">${steps.map((x,n)=>`${n?'<b>→</b>':''}<span>${esc(x)}</span>`).join('')}</div></div>${i.trap?`<div class="detail-note">⚠ <b>边界与易错点：</b>${esc(i.trap)}</div>`:'<div class="detail-note">💡 <b>表达建议：</b>先给结论，再按上述顺序展开；如果面试官继续追问，再结合数据规模、延迟目标和项目约束说明取舍。</div>'}`}
    function qas(items){return `<div class="qa-list">${items.map((i,n)=>{const idx=ITEMS.indexOf(i);return `<article class="qa" id="q-${idx}"><button data-toggle="${idx}"><span class="qno">Q${String(n+1).padStart(2,'0')}</span><h3>${esc(i.q)}${i.src||i.origin?'<span class="learn-badge">面经题</span>':''}</h3><span class="version-hint">含简短版 · 详细版</span><span class="plus">＋</span></button><div class="answer"><div class="answer-switch" role="tablist" aria-label="答案详细程度"><button class="active" data-version="short" data-item="${idx}">简短版</button><button data-version="detail" data-item="${idx}">详细版</button></div><div class="answer-version active" data-answer-version="short"><div class="formula">回答骨架：${esc(i.key)}</div><p>${esc(i.a)}</p>${i.trap?`<span class="trap">⚠ 易错提醒：${esc(i.trap)}</span>`:''}</div><div class="answer-version" data-answer-version="detail">${detailed(i)}</div><div class="answer-actions"><button data-study="${idx}">${state.studied.has(idx)?'✓ 已复习':'标记已复习'}</button><button data-star="${idx}">${state.stars.has(idx)?'★ 取消收藏':'☆ 收藏'}</button>${i.src?`<a class="source-link" href="${i.src}" target="_blank" rel="noopener">查看公开面经 ↗</a>`:i.origin?`<span class="source-link">${esc(i.origin)}</span>`:''}</div></div></article>`}).join('')}</div>`}
    function lessons(cat){const list=LESSONS[cat]||[];if(!list.length)return '';return `<div class="learning-roadmap"><div class="road-step"><b>1</b><span>先读章节，建立完整心智模型</span></div><div class="road-step"><b>2</b><span>再看概念卡片，快速复盘关键点</span></div><div class="road-step"><b>3</b><span>最后口述问答，检查表达与盲区</span></div></div><div class="lesson-list">${list.map((x,n)=>`<article class="lesson ${n===0?'open':''}"><button data-lesson><span class="lesson-no">${String(n+1).padStart(2,'0')}</span><div class="lesson-title"><small>${x.time} · 学习章节</small><h3>${esc(x.title)}</h3></div><span class="lesson-goal">${esc(x.goal)}</span><span class="lesson-toggle">${n===0?'−':'＋'}</span></button><div class="lesson-body"><p class="lesson-intro">${esc(x.intro)}</p><div class="lesson-points">${x.points.map(p=>`<section class="lesson-point"><h4>${esc(p.h)}</h4><p>${esc(p.p)}</p></section>`).join('')}</div>${x.code?`<pre class="lesson-code">${esc(x.code)}</pre>`:''}${x.note?`<div class="lesson-note">💡 ${esc(x.note)}</div>`:''}${x.refs?`<div class="lesson-note"><b>参考：</b> ${x.refs.map(r=>`<a href="${r[1]}" target="_blank" rel="noopener">${esc(r[0])} ↗</a>`).join(' · ')}</div>`:''}</div></article>`).join('')}</div>`}
    function home(){const featured=['warehouse','hadoop','hdfs','hive','spark','flink','kafka','lakehouse'].map(c=>ITEMS.find(i=>i.c===c)),topicCount=CATEGORIES.filter(c=>!['home','bank'].includes(c.id)).length,lessonCount=Object.values(LESSONS).reduce((n,x)=>n+x.length,0);return `<section class="hero"><div class="hero-main"><div class="eyebrow">DATA WAREHOUSE INTERVIEW PLAYBOOK</div><h1>先系统学习，再用<br>面试题检验表达</h1><p>从数据产生、采集、存储、计算，到建模、治理和应用。每个板块先读系统章节建立心智模型，再用概念卡和高频问答巩固。</p><div class="hero-tags"><span>${topicCount} 大主题 · ${lessonCount} 章系统学习</span><span>${ITEMS.length} 个核心知识点</span><span>本地保存复习进度</span></div></div><aside class="hero-side"><div><span>“</span><h2>先说结论，再讲原理，最后落到场景。</h2><p>这是技术面试中最清晰、也最容易让面试官追问下去的表达方式。</p></div><button data-random>开始随机练习 →</button></aside></section><section class="map-card"><div class="card-head"><div><div class="eyebrow">END-TO-END MAP</div><h2>一条数据的数仓旅程</h2></div><small>从左向右阅读</small></div><div class="flow"><div class="flow-node"><i>01 · SOURCE</i><strong>业务数据源</strong><small>MySQL · 日志 · API</small></div><b class="flow-arrow">→</b><div class="flow-node"><i>02 · INGEST</i><strong>采集与消息</strong><small>Flink CDC · Kafka</small></div><b class="flow-arrow">→</b><div class="flow-node hot"><i>03 · WAREHOUSE</i><strong>存储与计算</strong><small>Hadoop · HDFS · Hive · Spark · Flink</small></div><b class="flow-arrow">→</b><div class="flow-node last"><i>04 · SERVING</i><strong>数据应用</strong><small>湖仓 · OLAP · 报表 · 推荐 · 风控</small></div></div></section><div class="section-head"><div><div class="eyebrow">START HERE</div><h2>核心知识入口</h2></div><p>点击卡片进入“学习 → 复盘 → 问答”</p></div>${cards(featured)}<div class="section-head"><div><div class="eyebrow">INTERVIEW DRILL</div><h2>今日高频三问</h2></div><p>建议先口述，再展开答案</p></div>${qas([ITEMS.find(i=>i.t==='Hadoop 整体架构'),ITEMS.find(i=>i.t==='HDFS 写流程'),ITEMS.find(i=>i.t==='Spark 数据倾斜')])}<div class="source-strip">内容已融合你提供的《HiveSQL》《数据治理》和面试题整理材料，并依据公开牛客面经梳理高频方向；组件原理同时以 Apache Hadoop、Spark、Flink、Kafka 等官方文档校验。小红书公开页面在搜索端可检索性有限，因此不把无法核验的帖子直接写成技术结论。</div>`}
    function bankFiltered(){const q=state.bankQuery.toLowerCase();return ITEMS.filter((i,idx)=>{const catOK=state.bankCat==='all'||i.c===state.bankCat;const modeOK=state.bankMode==='all'||(state.bankMode==='source'&&(i.src||i.origin))||(state.bankMode==='star'&&state.stars.has(idx))||(state.bankMode==='unreviewed'&&!state.studied.has(idx))||(state.bankMode==='high'&&(i.tag.includes('高频')||i.tag.includes('真题')||i.tag.includes('五星')));const queryOK=!q||[i.t,i.q,i.a,i.key,i.tag,CATEGORIES.find(c=>c.id===i.c)?.name].join(' ').toLowerCase().includes(q);return catOK&&modeOK&&queryOK})}
    function bankPage(){const list=bankFiltered(),sourceCount=ITEMS.filter(i=>i.src||i.origin).length;return `<section class="bank-hero"><div><div class="eyebrow">INTERVIEW QUESTION BANK</div><h1>专项面试题库</h1><p>把所有板块的问题集中到一个入口。每道题均提供可直接口述的简短版和便于系统理解的结构化详细版，也可以按主题、题型和复习状态筛选。</p></div><button data-bank-random>从当前结果随机抽题 →</button></section><div class="bank-stats"><div class="bank-stat"><b>${ITEMS.length}</b><span>题目总数</span></div><div class="bank-stat"><b>${sourceCount}</b><span>真实面经题</span></div><div class="bank-stat"><b>${state.studied.size}</b><span>已复习</span></div><div class="bank-stat"><b>${state.stars.size}</b><span>已收藏</span></div></div><section class="bank-controls"><label class="bank-search"><span>⌕</span><input id="bankSearch" value="${esc(state.bankQuery)}" placeholder="在题库中搜索题目、答案或知识点…"></label><div class="bank-row"><span>知识主题</span><button data-bank-cat="all" class="${state.bankCat==='all'?'active':''}">全部</button>${CATEGORIES.filter(c=>!['home','bank'].includes(c.id)).map(c=>`<button data-bank-cat="${c.id}" class="${state.bankCat===c.id?'active':''}">${c.name}</button>`).join('')}</div><div class="bank-row"><span>题目类型</span>${[['all','全部题目'],['high','高频 / 真题'],['source','真实面经'],['unreviewed','未复习'],['star','已收藏']].map(([id,name])=>`<button data-bank-mode="${id}" class="${state.bankMode===id?'active':''}">${name}</button>`).join('')}</div></section><div class="bank-result-head"><h2>练习题目</h2><span id="bankCount">当前 ${list.length} 题</span></div><div id="bankList">${list.length?qas(list):'<div class="bank-empty">没有符合当前条件的题目，换一个筛选条件试试。</div>'}</div>`}
    function refreshBank(){const list=bankFiltered();const area=$('#bankList');if(!area)return;area.innerHTML=list.length?qas(list):'<div class="bank-empty">没有符合当前条件的题目，换一个筛选条件试试。</div>';$('#bankCount').textContent=`当前 ${list.length} 题`;bind()}
    function category(c,items){return `<div class="crumb"><span>知识体系</span><b>›</b><span>${c.name}</span></div><section class="category-hero"><div><div class="eyebrow">CHAPTER · ${c.id.toUpperCase()}</div><h1>${c.name}</h1><p>${c.desc}</p></div><div class="category-meta"><b>${items.length}</b><span>核心知识点</span></div></section><div class="section-head"><div><div class="eyebrow">SYSTEMATIC LEARNING</div><h2>系统学习章节</h2></div><p>按顺序学习，每章约 12～22 分钟</p></div>${lessons(c.id)}<div class="section-head"><div><div class="eyebrow">KNOWLEDGE CARDS</div><h2>概念速览</h2></div><p>学习后快速复盘</p></div><div class="filterbar"><button class="active">全部</button>${[...new Set(items.map(i=>i.tag))].map(x=>`<button data-tag="${x}">${x}</button>`).join('')}</div><div id="topicArea">${cards(items)}</div><div class="section-head"><div><div class="eyebrow">HIGH-FREQUENCY Q&A</div><h2>高频面试问答</h2></div><p>展开后可标记复习或收藏</p></div><div class="interview-layout"><div id="qaArea">${qas(items)}</div><aside class="study-panel"><h3>本板块进度</h3><div class="ring" style="--progress:${items.length?Math.round(items.filter(i=>state.studied.has(ITEMS.indexOf(i))).length/items.length*100):0}%"><b>${items.filter(i=>state.studied.has(ITEMS.indexOf(i))).length}/${items.length}</b></div><div class="mini-stat"><span>学习章节</span><b>${(LESSONS[c.id]||[]).length} 章</b></div><div class="mini-stat"><span>已收藏</span><b>${items.filter(i=>state.stars.has(ITEMS.indexOf(i))).length}</b></div><div class="mini-stat"><span>推荐顺序</span><b>学习 → 复盘 → 口述</b></div><div class="tip">答题建议：控制在 60～90 秒。先一句话给结论，再列 2～3 个关键点，最后补充项目中的实践或取舍。</div></aside></div><div class="source-strip">本版学习章节参考了你提供的《HiveSQL》《数据治理》资料；面经题来自公开牛客帖子。公开面经用于判断高频方向，技术解释已重新组织，不直接照搬答案。</div>`}
    function searchView(items){return `<div class="crumb"><span>全局搜索</span><b>›</b><span>“${esc(state.query)}”</span></div><section class="category-hero"><div><div class="eyebrow">SEARCH RESULTS</div><h1>搜索结果</h1><p>标题、概念摘要、问题和答案都会参与匹配。</p></div><div class="category-meta"><b>${items.length}</b><span>条匹配内容</span></div></section>${items.length?qas(items):'<div class="empty"><b>没有找到相关内容</b>试试“HDFS 写流程”“数据倾斜”或“事务”。</div>'}`}
    function bind(){document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{const lesson=b.closest('.lesson');lesson.classList.toggle('open');b.querySelector('.lesson-toggle').textContent=lesson.classList.contains('open')?'−':'＋'});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const q=$('#q-'+b.dataset.toggle);q.classList.toggle('open');b.querySelector('.plus').textContent=q.classList.contains('open')?'−':'＋'});document.querySelectorAll('[data-version]').forEach(b=>b.onclick=e=>{e.stopPropagation();const answer=b.closest('.answer'),version=b.dataset.version;answer.querySelectorAll('[data-version]').forEach(x=>x.classList.toggle('active',x===b));answer.querySelectorAll('[data-answer-version]').forEach(x=>x.classList.toggle('active',x.dataset.answerVersion===version))});document.querySelectorAll('[data-study]').forEach(b=>b.onclick=e=>{e.stopPropagation();const n=+b.dataset.study;state.studied.has(n)?state.studied.delete(n):state.studied.add(n);save();render();toast(state.studied.has(n)?'已标记为复习':'已取消复习标记')});document.querySelectorAll('[data-star]').forEach(b=>b.onclick=e=>{e.stopPropagation();const n=+b.dataset.star;state.stars.has(n)?state.stars.delete(n):state.stars.add(n);save();render();toast(state.stars.has(n)?'已加入收藏':'已取消收藏')});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const i=ITEMS[+b.dataset.open];state.cat=i.c;state.onlyStar=false;render();setTimeout(()=>{const el=[...document.querySelectorAll('.qa h3')].find(x=>x.textContent.startsWith(i.q))?.closest('.qa');el?.scrollIntoView({behavior:'smooth',block:'center'});el?.classList.add('open')},50)});document.querySelectorAll('[data-random]').forEach(b=>b.onclick=random);const filter=(tag,button)=>{document.querySelectorAll('.filterbar button').forEach(x=>x.classList.remove('active'));button.classList.add('active');const base=ITEMS.filter(i=>i.c===state.cat),filtered=tag?base.filter(i=>i.tag===tag):base;$('#topicArea').innerHTML=cards(filtered);$('#qaArea').innerHTML=qas(filtered);bind()};document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>filter(b.dataset.tag,b));document.querySelector('.filterbar>button:not([data-tag])')?.addEventListener('click',e=>filter('',e.currentTarget))}
    function bindBank(){document.querySelectorAll('[data-bank-cat]').forEach(b=>b.onclick=()=>{state.bankCat=b.dataset.bankCat;render()});document.querySelectorAll('[data-bank-mode]').forEach(b=>b.onclick=()=>{state.bankMode=b.dataset.bankMode;render()});const input=$('#bankSearch');if(input)input.oninput=e=>{state.bankQuery=e.target.value;refreshBank()};document.querySelector('[data-bank-random]')?.addEventListener('click',()=>{const pool=bankFiltered();if(!pool.length)return toast('当前筛选下没有题目');const item=pool[Math.floor(Math.random()*pool.length)],idx=ITEMS.indexOf(item),el=$('#q-'+idx);el?.classList.add('open');el?.querySelector('.plus')&&(el.querySelector('.plus').textContent='−');el?.scrollIntoView({behavior:'smooth',block:'center'})})}
    function render(){renderNav();let body;if(state.query){const q=state.query.toLowerCase();body=searchView(ITEMS.filter(i=>[i.t,i.s,i.q,i.a,i.key,i.tag,CATEGORIES.find(c=>c.id===i.c)?.name].join(' ').toLowerCase().includes(q)))}else if(state.onlyStar){body=`<section class="category-hero"><div><div class="eyebrow">BOOKMARKS</div><h1>我的收藏</h1><p>集中复习你标记过的重点问题。</p></div></section>${state.stars.size?qas(ITEMS.filter((_,i)=>state.stars.has(i))):'<div class="empty"><b>还没有收藏</b>展开任意问题，点击“收藏”即可加入。</div>'}`}else if(state.cat==='home')body=home();else if(state.cat==='bank')body=bankPage();else{const c=CATEGORIES.find(x=>x.id===state.cat);body=category(c,ITEMS.filter(i=>i.c===c.id))}$('#content').innerHTML=body;$('#showStar').textContent=state.onlyStar?'★ 收藏中':'☆ 收藏';bind();bindBank();updateProgress();window.scrollTo({top:0})}
    function random(){const n=Math.floor(Math.random()*ITEMS.length),i=ITEMS[n];state.cat=i.c;state.onlyStar=false;state.query='';$('#search').value='';render();setTimeout(()=>{const el=$('#q-'+n);el?.classList.add('open');el?.scrollIntoView({behavior:'smooth',block:'center'})},50)}
    $('#search').addEventListener('input',e=>{state.query=e.target.value.trim();state.onlyStar=false;render()});$('#randomQ').onclick=random;$('#showStar').onclick=()=>{state.onlyStar=!state.onlyStar;state.query='';$('#search').value='';render()};$('.mobile-menu').onclick=()=>$('.sidebar').classList.toggle('mobile-open');document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus()}if(e.key==='Escape')$('.sidebar').classList.remove('mobile-open')});render();
  </script>
</body>
</html>
